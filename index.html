<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="description" content="Wedding quote estimator for Silent Waters Private Villa, Montego Bay, Jamaica.">
<title data-copy="masthead.pageTitle"></title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23FAF9F6'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' fill='%23827230' text-anchor='middle'%3ESW%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------
   Silent Waters — tokens
   Palette sampled from silentwatersvilla.com (gold #827230, off-white
   ground, black-ink nav in letter-spaced caps) blended with the brief's
   navy ink. Light theme only, forced.
   --------------------------------------------------------------- */
:root{
  color-scheme: light only;

  /* colour */
  --ink:        #1C2B4A;
  --ink-soft:   #46567A;
  --ink-mute:   #7F8CA6;
  --gold:       #827230;
  --gold-soft:  #A79351;
  --gold-wash:  #F3EFE2;
  --blue:       #5B9BD5;
  --blue-wash:  #EDF4FB;
  --bg:         #FAF9F6;
  --surface:    #FFFFFF;
  --line:       #E4DFD3;
  --line-soft:  #EFEBE1;
  --warn:       #8A5A12;
  --warn-wash:  #FBF3E4;

  /* Calendar day states. Booked runs COOL so it cannot be mistaken for the
     warm gold selection wash; disabled days get faint text and no tile.
     --booked-ink on --booked-tile is 5.13:1, WCAG AA. */
  --booked-tile: #E9E9EC;
  --booked-ink:  #50608A;
  --day-faint:   #C9CBD1;

  /* spacing scale */
  --s-3xs: 0.125rem;
  --s-2xs: 0.25rem;
  --s-xs:  0.5rem;
  --s-sm:  0.75rem;
  --s-md:  1rem;
  --s-lg:  1.5rem;
  --s-xl:  2rem;
  --s-2xl: 2.75rem;
  --s-3xl: 4rem;

  /* type scale */
  --fs-2xs: 0.6875rem;
  --fs-xs:  0.8125rem;
  --fs-sm:  0.9375rem;
  --fs-md:  1.0625rem;
  --fs-lg:  1.25rem;
  --fs-xl:  1.625rem;
  --fs-2xl: 2.125rem;
  --fs-3xl: 2.875rem;

  /* geometry */
  --radius-sm:  0.375rem;
  --radius-md:  0.625rem;
  --radius-lg:  1rem;
  --radius-pill: 62.5rem;
  --tap:        3.25rem;
  --tap-sm:     2.75rem;
  --measure:    32rem;
  --track:      0.0625rem;
  --rule-thick: 0.1875rem;

  /* type families */
  --font-display: "Cormorant Garamond", "Times New Roman", Georgia, serif;
  --font-ui: "Jost", "Gill Sans Nova", "Gill Sans", "Avenir Next", system-ui, sans-serif;

  /* letter-spacing */
  --ls-wordmark: 0.34em;
  --ls-caps:     0.16em;
  --ls-tight:    0.01em;

  --shadow-card: 0 var(--s-2xs) var(--s-md) rgba(28,43,74,.06);
  --shadow-bar:  0 calc(-1 * var(--s-2xs)) var(--s-md) rgba(28,43,74,.07);
}

*, *::before, *::after { box-sizing: border-box; }

html, body { margin:0; padding:0; }

body{
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: var(--fs-md);
  font-weight: 400;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(var(--s-3xl) + var(--s-xl));
}

/* ---------------- masthead ---------------- */
.masthead{
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: var(--s-lg) var(--s-md) var(--s-sm);
  border-bottom: 1px solid var(--line-soft);
  background: var(--surface);
}
.wordmark{
  font-family: var(--font-display);
  font-weight: 500;
  font-size: var(--fs-lg);
  letter-spacing: var(--ls-wordmark);
  text-indent: var(--ls-wordmark);
  text-transform: uppercase;
  line-height: 1.2;
  margin: 0;
  text-align: center;
  color: var(--ink);
}
.wordmark .wordmark__sub{
  display: block;
  font-family: var(--font-ui);
  font-weight: 400;
  font-size: var(--fs-2xs);
  letter-spacing: var(--ls-caps);
  text-indent: var(--ls-caps);
  color: var(--gold);
  margin-top: var(--s-xs);
}
.masthead__rule{
  width: 18%;
  height: var(--track);
  background: var(--gold-soft);
  margin: var(--s-sm) 0 var(--s-xs);
  border: 0;
}
.masthead__kicker{
  font-size: var(--fs-2xs);
  letter-spacing: var(--ls-caps);
  text-indent: var(--ls-caps);
  text-transform: uppercase;
  color: var(--ink-mute);
  margin: 0;
}

/* ---------------- progress ---------------- */
.progress{
  display: flex;
  justify-content: center;
  align-items: center;
  gap: var(--s-xs);
  padding: var(--s-md) var(--s-md) 0;
}
.progress__dot{
  display: block;
  width: var(--s-xs);
  height: var(--s-xs);
  border-radius: var(--radius-pill);
  background: var(--line);
  transition: background .18s ease, transform .18s ease;
}
.progress__dot[data-state="done"]{ background: var(--gold-soft); }
.progress__dot[data-state="current"]{ background: var(--gold); transform: scale(1.55); }

/* ---------------- layout ---------------- */
main{
  max-width: var(--measure);
  margin: 0 auto;
  padding: var(--s-lg) var(--s-md) var(--s-xl);
}
.step[hidden]{ display: none; }
.step__eyebrow{
  font-size: var(--fs-2xs);
  letter-spacing: var(--ls-caps);
  text-indent: var(--ls-caps);
  text-transform: uppercase;
  color: var(--gold);
  margin: 0 0 var(--s-xs);
}
.step__title{
  font-family: var(--font-display);
  font-weight: 500;
  font-size: var(--fs-2xl);
  line-height: 1.12;
  letter-spacing: var(--ls-tight);
  margin: 0 0 var(--s-xs);
}
.step__lede{
  color: var(--ink-soft);
  font-size: var(--fs-sm);
  margin: 0 0 var(--s-lg);
}

/* ---------------- fields ---------------- */
.field{ margin-bottom: var(--s-md); }
.field__label{
  display: block;
  font-size: var(--fs-2xs);
  letter-spacing: var(--ls-caps);
  text-indent: var(--ls-caps);
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-bottom: var(--s-xs);
}
input[type="number"]{
  font-family: var(--font-ui);
  font-size: var(--fs-md);
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 0 var(--s-md);
  height: var(--tap);
  width: 100%;
  appearance: none;
}
input:focus-visible, button:focus-visible, a:focus-visible, summary:focus-visible{
  outline: 2px solid var(--gold);
  outline-offset: var(--s-3xs);
}
.row{ display: flex; gap: var(--s-sm); }
.row > .field{ flex: 1 1 50%; margin-bottom: var(--s-md); min-width: 0; }

/* ---------------- date field + calendar ---------------- */
.datefield{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-sm);
  width: 100%;
  min-height: var(--tap);
  padding: 0 var(--s-md);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  font-family: var(--font-ui);
  font-size: var(--fs-md);
  color: var(--ink);
  text-align: left;
  cursor: pointer;
}
.datefield[aria-expanded="true"]{ border-color: var(--gold); }
.datefield__value{ flex: 1 1 auto; min-width: 0; }
.datefield--empty .datefield__value{ color: var(--ink-mute); }
.datefield__nights{ color: var(--gold); }
.datefield__icon{ flex: 0 0 auto; color: var(--gold); font-size: var(--fs-sm); }

.cal{
  margin-top: var(--s-sm);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: var(--s-sm);
}
.cal[hidden]{ display: none; }
.cal__head{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-sm);
  margin-bottom: var(--s-xs);
}
.cal__nav{
  flex: 0 0 auto;
  width: var(--tap-sm);
  height: var(--tap-sm);
  border: 0;
  border-radius: var(--radius-sm);
  background: var(--gold-wash);
  color: var(--gold);
  font-size: var(--fs-md);
  line-height: 1;
  cursor: pointer;
}
.cal__nav:disabled{ opacity: .3; cursor: not-allowed; }

.cal__title{
  flex: 1 1 auto;
  text-align: center;
  font-family: var(--font-display);
  font-size: var(--fs-lg);
  font-weight: 600;
  margin: 0;
  min-width: 0;
}
.cal__grid{ display: grid; grid-template-columns: repeat(7, 1fr); }
.cal__dow{
  text-align: center;
  font-size: var(--fs-2xs);
  color: var(--ink-mute);
  padding: var(--s-2xs) 0;
}
.cal__cell{ position: relative; padding: var(--s-3xs); }
.cal__day{
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  aspect-ratio: 1 / 1;
  border: 0;
  background: transparent;
  border-radius: var(--radius-sm);
  font-family: var(--font-ui);
  font-size: var(--fs-sm);
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  cursor: pointer;
}
/* Past days, and days that would break the season minimum: faint text
   only, NO tile — a tile is reserved for booked nights, so "taken" and
   "not selectable" read as different things. */
.cal__day:disabled{ color: var(--day-faint); cursor: not-allowed; }

/* Booked nights (Level 1: the BLOCKED list; Level 2: the synced feed).
   A cool gray tile with a struck-through gray-blue numeral — the only day
   state that carries a tile, and cool against the warm selection wash. */
.cal__day[data-blocked="1"]{
  color: var(--booked-ink);
  text-decoration: line-through;
  background: var(--booked-tile);
  border-radius: var(--radius-sm);
}

/* Today: an outlined circle, never filled — it is a landmark, not a choice. */
.cal__day[data-today="1"]{
  box-shadow: inset 0 0 0 1px var(--ink-mute);
  border-radius: var(--radius-pill);
}

/* The nights between the two ends: a light wash behind the cell. */
.cal__cell[data-in-range="1"]{ background: var(--gold-wash); }
.cal__cell[data-edge="start"]{ background: var(--gold-wash); border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
.cal__cell[data-edge="end"]{ background: var(--gold-wash); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.cal__cell[data-edge="only"]{ background: transparent; }

/* The two ends themselves: solid gold, and gold beats the today outline. */
.cal__day[data-edge]{
  background: var(--gold);
  color: #fff;
  font-weight: 600;
  border-radius: var(--radius-sm);
  box-shadow: none;
}
.cal__day[data-seventh="1"]::after{
  content: "";
  position: absolute;
  left: 50%;
  bottom: var(--s-2xs);
  width: var(--s-2xs);
  height: var(--s-2xs);
  margin-left: calc(-1 * var(--s-3xs));
  border-radius: var(--radius-pill);
  background: var(--blue);
}
.cal__day[data-edge][data-seventh="1"]::after{ background: #fff; }
.cal__foot{
  margin: var(--s-xs) 0 0;
  padding-top: var(--s-xs);
  border-top: 1px solid var(--line-soft);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-sm);
  font-size: var(--fs-2xs);
  color: var(--ink-mute);
}
.cal__legend{ display: flex; align-items: center; gap: var(--s-2xs); }
.cal__legend::before{
  content: "";
  width: var(--s-2xs);
  height: var(--s-2xs);
  border-radius: var(--radius-pill);
  background: var(--blue);
}
.cal__legend--booked{ color: var(--booked-ink); text-decoration: line-through; }
.cal__legend--booked::before{ background: var(--booked-tile); border-radius: var(--radius-sm); }
.cal__done{
  border: 0;
  background: none;
  color: var(--gold);
  font-family: var(--font-ui);
  font-size: var(--fs-2xs);
  letter-spacing: var(--ls-caps);
  text-transform: uppercase;
  cursor: pointer;
  padding: var(--s-2xs) 0;
}

/* One month at every width. Only the sizing changes. */
@media (min-width: 40rem){
  .cal{ padding: var(--s-md); }
  .cal__day{ font-size: var(--fs-md); }
  .cal__dow{ font-size: var(--fs-xs); }
  .cal__title{ font-size: var(--fs-xl); }
}

/* ---------------- callouts ---------------- */
.note{
  display: flex;
  gap: var(--s-sm);
  border-radius: var(--radius-md);
  padding: var(--s-sm) var(--s-md);
  font-size: var(--fs-xs);
  line-height: 1.5;
  margin: var(--s-sm) 0 0;
}
.note--info{ background: var(--blue-wash); color: var(--ink-soft); }
.note--brand{ background: var(--gold-wash); color: var(--ink-soft); }
.note--warn{ background: var(--warn-wash); color: var(--warn); }
.note strong{ font-weight: 600; }
.note[hidden]{ display: none; }

/* ---------------- steppers ---------------- */
.stepper{
  display: flex;
  align-items: center;
  gap: var(--s-sm);
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: var(--radius-md);
  padding: var(--s-2xs);
}
.stepper__btn{
  flex: 0 0 22%;
  height: var(--tap-sm);
  border: 0;
  border-radius: var(--radius-sm);
  background: var(--gold-wash);
  color: var(--gold);
  font-family: var(--font-ui);
  font-size: var(--fs-lg);
  font-weight: 500;
  line-height: 1;
  cursor: pointer;
}
.stepper__btn:disabled{ opacity: .38; cursor: not-allowed; }
.stepper__value{
  flex: 1 1 56%;
  text-align: center;
  font-size: var(--fs-lg);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  border: 0;
  background: transparent;
  height: var(--tap-sm);
  padding: 0;
  min-width: 0;
}
.countgrid{ display: flex; flex-wrap: wrap; gap: var(--s-sm); }
.countgrid > .count{ flex: 1 1 46%; min-width: 0; }
.count__label{
  display: block;
  font-size: var(--fs-xs);
  color: var(--ink-soft);
  margin-bottom: var(--s-2xs);
}
.count__hint{ color: var(--ink-mute); font-size: var(--fs-2xs); }

.tally{
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  border-top: 1px solid var(--line-soft);
  margin-top: var(--s-md);
  padding-top: var(--s-sm);
}
.tally__n{
  font-family: var(--font-display);
  font-size: var(--fs-xl);
  font-weight: 500;
}
.tally__l{
  font-size: var(--fs-2xs);
  letter-spacing: var(--ls-caps);
  text-transform: uppercase;
  color: var(--ink-mute);
}

/* ---------------- always-included panel (R1) ---------------- */
.included{
  background: var(--gold-wash);
  border-radius: var(--radius-md);
  padding: var(--s-md);
  margin-bottom: var(--s-md);
}
.included__title{
  display: block;
  font-size: var(--fs-2xs);
  letter-spacing: var(--ls-caps);
  text-indent: var(--ls-caps);
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: var(--s-xs);
}
.included__list{ margin: 0; padding: 0; list-style: none; }
.included__list li{
  display: flex;
  gap: var(--s-xs);
  align-items: baseline;
  font-size: var(--fs-sm);
  color: var(--ink-soft);
  padding: var(--s-3xs) 0;
}
.included__list li::before{ content: "\2013"; color: var(--gold-soft); }
.included__foot{
  font-size: var(--fs-2xs);
  color: var(--ink-mute);
  margin: var(--s-xs) 0 0;
  line-height: 1.5;
}

/* ---------------- the 7-night lever (R6) ---------------- */
.lever{
  background: var(--blue-wash);
  border-left: var(--rule-thick) solid var(--blue);
  border-radius: 0 var(--radius-md) var(--radius-md) 0;
  padding: var(--s-sm) var(--s-md);
  margin: var(--s-md) 0 0;
  font-size: var(--fs-xs);
  line-height: 1.55;
  color: var(--ink-soft);
}
.lever[hidden]{ display: none; }
.lever__title{
  display: block;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: var(--s-3xs);
}
.lever strong{ color: var(--ink); font-weight: 600; }

/* ---------------- choice cards ---------------- */
.choices{ display: flex; flex-direction: column; gap: var(--s-sm); }
.choices--split{ flex-direction: row; flex-wrap: wrap; }
.choices--split > .choice{ flex: 1 1 46%; min-width: 0; }
.choice{
  display: block;
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: var(--s-md);
  cursor: pointer;
  transition: border-color .16s ease, background .16s ease;
}
.choice input{ position: absolute; opacity: 0; pointer-events: none; }
.choice__title{
  display: block;
  font-family: var(--font-display);
  font-size: var(--fs-lg);
  font-weight: 500;
  line-height: 1.2;
}
.choice__meta{
  display: block;
  font-size: var(--fs-xs);
  color: var(--ink-soft);
  margin-top: var(--s-2xs);
}
/* Optional per-item wording, filled in from PRICES `description` fields. */
.choice__desc{
  display: block;
  font-size: var(--fs-xs);
  line-height: 1.5;
  color: var(--ink-soft);
  margin-top: var(--s-2xs);
}
.choice__price{
  display: block;
  font-size: var(--fs-sm);
  color: var(--gold);
  font-weight: 500;
  margin-top: var(--s-2xs);
  font-variant-numeric: tabular-nums;
}
/* R2 — the disclosure has to be visible at the moment of choosing, not
   only further down the page. */
.choice__flag{
  display: block;
  margin-top: var(--s-xs);
  padding: var(--s-xs) var(--s-sm);
  background: var(--warn-wash);
  color: var(--warn);
  border-left: var(--rule-thick) solid var(--warn);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  font-size: var(--fs-2xs);
  font-weight: 600;
  line-height: 1.45;
}
.choice:has(input:checked){
  border-color: var(--gold);
  background: var(--gold-wash);
}
.choice:has(input:disabled){ opacity: .5; cursor: not-allowed; }

/* ---------------- checkbox extras ---------------- */
.extra{
  display: flex;
  align-items: flex-start;
  gap: var(--s-sm);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: var(--s-md);
  cursor: pointer;
  min-height: var(--tap);
}
.extra:has(input:checked){ border-color: var(--gold); background: var(--gold-wash); }
/* Items Silent Waters prices on request — selectable, but no figure. */
.extra--quoted .extra__meta{ color: var(--gold); font-style: italic; }
.extra input{
  flex: 0 0 auto;
  width: var(--s-lg);
  height: var(--s-lg);
  margin: 0;
  accent-color: var(--gold);
}
.extra__body{ flex: 1 1 88%; min-width: 0; }
.extra__title{ display:block; font-weight: 500; font-size: var(--fs-sm); }
.extra__meta{ display:block; font-size: var(--fs-xs); color: var(--ink-soft); }

/* Sits at the top of the estimate screen, before any number is shown. */
.topline{
  background: var(--gold-wash);
  border-left: var(--rule-thick) solid var(--gold);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  padding: var(--s-xs) var(--s-sm);
  margin: 0 0 var(--s-sm);
  font-size: var(--fs-xs);
  font-weight: 500;
  color: var(--gold);
  line-height: 1.45;
}

/* ---------------- estimate ---------------- */
.headline{
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: var(--s-lg) var(--s-md);
  text-align: center;
  box-shadow: var(--shadow-card);
}
.headline__label{
  font-size: var(--fs-2xs);
  letter-spacing: var(--ls-caps);
  text-indent: var(--ls-caps);
  text-transform: uppercase;
  color: var(--ink-mute);
  margin: 0 0 var(--s-xs);
}
.headline__range{
  font-family: var(--font-display);
  font-size: var(--fs-2xl);
  font-weight: 600;
  line-height: 1.05;
  letter-spacing: var(--ls-tight);
  margin: 0;
  font-variant-numeric: tabular-nums;
}
.headline__sub{
  font-size: var(--fs-xs);
  color: var(--ink-soft);
  margin: var(--s-sm) 0 0;
}
.headline__meta{
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: var(--s-xs) var(--s-sm);
  margin-top: var(--s-md);
  padding-top: var(--s-sm);
  border-top: 1px solid var(--line-soft);
  font-size: var(--fs-2xs);
  letter-spacing: var(--ls-caps);
  text-transform: uppercase;
  color: var(--ink-mute);
}

details.breakdown{
  margin-top: var(--s-md);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  overflow: hidden;
}
details.breakdown > summary{
  list-style: none;
  cursor: pointer;
  padding: var(--s-md);
  min-height: var(--tap);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: var(--fs-2xs);
  letter-spacing: var(--ls-caps);
  text-transform: uppercase;
  color: var(--ink-soft);
}
details.breakdown > summary::-webkit-details-marker{ display:none; }
details.breakdown > summary::after{ content: "+"; color: var(--gold); font-size: var(--fs-lg); line-height: 1; }
details.breakdown[open] > summary::after{ content: "–"; }
.lines{ padding: 0 var(--s-md) var(--s-md); }
.line{
  display: flex;
  align-items: baseline;
  gap: var(--s-sm);
  padding: var(--s-xs) 0;
  border-top: 1px solid var(--line-soft);
  font-size: var(--fs-sm);
}
.line__name{ flex: 1 1 62%; min-width: 0; }
.line__sub{ display:block; font-size: var(--fs-2xs); color: var(--ink-mute); }
.line__val{
  flex: 0 0 34%;
  text-align: right;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.line--total{ font-weight: 600; border-top: 1px solid var(--line); margin-top: var(--s-2xs); }
/* Section headers and per-section subtotals (London meeting 2026-08-24). */
.line--group{
  border-top: 0;
  padding: var(--s-md) 0 var(--s-2xs);
  font-family: var(--font-display);
  font-size: var(--fs-lg);
  font-weight: 600;
  color: var(--ink);
}
.line--group + .line{ border-top-color: var(--gold-soft); }
.line--subtotal{ font-weight: 600; }
.line--subtotal .line__name, .line--subtotal .line__val{ color: var(--ink); }
.line--muted .line__name, .line--muted .line__val{ color: var(--ink-mute); }

/* A credit — the direct-booking discount (Statement p.1) */
.line--credit .line__name{ color: var(--gold); font-weight: 500; }
.line--credit .line__val{ color: var(--gold); font-weight: 600; }
.line--sub{ border-top-color: transparent; padding-top: 0; }
.line--sub .line__name, .line--sub .line__val{ color: var(--ink-soft); font-weight: 500; }

/* Included at no charge (R1) */
.line--included .line__name{ color: var(--gold); font-weight: 500; }
.line--included .line__val{ color: var(--gold); font-weight: 500; }

/* Disclosed but deliberately not estimated (R2) — must not read as a total */
.line--disclose{
  background: var(--warn-wash);
  border-top-color: transparent;
  border-left: var(--rule-thick) solid var(--warn);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  padding: var(--s-xs) var(--s-sm);
  margin: var(--s-xs) 0;
}
.line--disclose .line__name{ color: var(--warn); font-weight: 600; }
.line--disclose .line__val{ color: var(--warn); font-weight: 600; }
.line--disclose .line__sub{ color: var(--warn); opacity: .85; }

.footnote{
  font-size: var(--fs-2xs);
  color: var(--ink-mute);
  line-height: 1.5;
  margin: var(--s-md) 0 0;
}
.disclaimer{
  font-size: var(--fs-2xs);
  color: var(--ink-mute);
  line-height: 1.5;
  margin: var(--s-md) 0 0;
  padding-top: var(--s-sm);
  border-top: 1px solid var(--line-soft);
}

/* ---------------- buttons ---------------- */
.btn{
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s-xs);
  width: 100%;
  min-height: var(--tap);
  padding: 0 var(--s-md);
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  font-family: var(--font-ui);
  font-size: var(--fs-2xs);
  font-weight: 500;
  letter-spacing: var(--ls-caps);
  text-indent: var(--ls-caps);
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
  text-align: center;
}
.btn--primary{ background: var(--ink); color: #fff; }
.btn--gold{ background: var(--gold); color: #fff; }
.btn--ghost{ background: transparent; color: var(--ink-soft); border-color: var(--line); }
.btn:disabled{ opacity: .4; cursor: not-allowed; }
.actions{ display: flex; flex-direction: column; gap: var(--s-sm); margin-top: var(--s-lg); }
.btn--wide{ margin-top: var(--s-sm); }
.startover{
  display: block;
  text-align: center;
  margin-top: var(--s-md);
  font-size: var(--fs-xs);
  color: var(--ink-mute);
  text-decoration: underline;
  text-underline-offset: var(--s-2xs);
  background: none;
  border: 0;
  width: 100%;
  cursor: pointer;
  font-family: var(--font-ui);
  min-height: var(--tap-sm);
}

/* ---------------- sticky nav ---------------- */
.navbar{
  position: fixed;
  left: 0; right: 0; bottom: 0;
  display: flex;
  gap: var(--s-sm);
  padding: var(--s-sm) var(--s-md) calc(var(--s-sm) + env(safe-area-inset-bottom, 0px));
  background: var(--surface);
  border-top: 1px solid var(--line-soft);
  box-shadow: var(--shadow-bar);
}
.navbar__inner{
  display: flex;
  gap: var(--s-sm);
  width: 100%;
  max-width: var(--measure);
  margin: 0 auto;
}
.navbar__inner > .btn{ flex: 1 1 50%; }
.navbar__inner > .btn--back{ flex: 0 0 34%; }
.navbar[hidden]{ display: none; }

.sr-only{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}
.toast{
  position: fixed;
  left: 50%;
  bottom: calc(var(--s-3xl) + var(--s-lg));
  transform: translateX(-50%);
  background: var(--ink);
  color: #fff;
  font-size: var(--fs-xs);
  padding: var(--s-xs) var(--s-md);
  border-radius: var(--radius-pill);
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease;
}
.toast[data-show="1"]{ opacity: 1; }

@media (min-width: 30rem){
  .headline__range{ font-size: var(--fs-3xl); }
  .actions{ flex-direction: row; }
  .actions > .btn{ flex: 1 1 50%; }
}
</style>
</head>
<body>

<header class="masthead">
  <h1 class="wordmark"><span data-copy="masthead.name"></span><span class="wordmark__sub" data-copy="masthead.subtitle"></span></h1>
  <hr class="masthead__rule">
  <p class="masthead__kicker" data-copy="masthead.location"></p>
</header>

<nav class="progress" id="progress" aria-label="Progress"></nav>

<main id="main">
  <section class="step" id="step-intro" aria-labelledby="t-intro">
    <h2 class="step__title" id="t-intro" data-copy="intro.title"></h2>
    <p class="step__lede" data-copy="intro.lede"></p>
    <div class="choices" id="scopeChoices"></div>
    <p class="note note--info" data-copy="intro.note"></p>
  </section>

  <section class="step" id="step-dates" aria-labelledby="t0" hidden>
    <p class="step__eyebrow" data-eyebrow></p>
    <h2 class="step__title" id="t0" data-copy="dates.title"></h2>
    <p class="step__lede" data-copy="dates.lede"></p>
    <div class="field">
      <span class="field__label" id="dateFieldLabel" data-copy="dates.fieldLabel"></span>
      <button type="button" class="datefield" id="dateField"
              aria-expanded="false" aria-labelledby="dateFieldLabel">
        <span class="datefield__value" id="dateFieldValue"></span>
        <span class="datefield__icon" aria-hidden="true">▾</span>
      </button>
      <div class="cal" id="cal" hidden></div>
    </div>
    <p class="note note--brand" id="seasonNote" hidden></p>
    <p class="note note--warn" id="minNote" hidden></p>
    <p class="note note--info" data-copy="dates.availabilityNote"></p>
    <p class="note note--info" id="discountHint"></p>
    <p class="note note--info" id="feeMinNote"></p>
    <div class="lever" id="leverDates" hidden></div>
  </section>

  <section class="step" id="step-guests" aria-labelledby="t1" hidden>
    <p class="step__eyebrow" data-eyebrow></p>
    <h2 class="step__title" id="t1" data-copy="guests.title"></h2>
    <p class="step__lede" data-copy="guests.lede"></p>
    <div class="countgrid" id="countgrid"></div>
    <div class="tally">
      <span class="tally__l" data-copy="guests.tallyLabel"></span>
      <span class="tally__n"><span id="stayerTotal">0</span> <span class="tally__l"><span data-copy="guests.tallyOf"></span> <span id="stayerCap"></span></span></span>
    </div>
    <p class="note note--warn" id="stayerNote" hidden></p>
    <p class="note note--brand" id="capNote" hidden></p>
    <p class="note note--info" id="surchargeNote"></p>
  </section>

  <section class="step" id="step-meal" aria-labelledby="t2" hidden>
    <p class="step__eyebrow" data-eyebrow></p>
    <h2 class="step__title" id="t2" data-copy="meal.title"></h2>
    <p class="step__lede" data-copy="meal.lede"></p>
    <div class="included" id="alwaysIncluded"></div>
    <div class="choices" id="mealChoices"></div>
    <p class="note note--warn" id="gourmetBarNote" hidden></p>
    <p class="note note--info" data-copy="meal.under5Note"></p>
  </section>

  <section class="step" id="step-extras" aria-labelledby="t4" hidden>
    <p class="step__eyebrow" data-eyebrow></p>
    <h2 class="step__title" id="t4" data-copy="extras.title"></h2>
    <p class="step__lede" data-copy="extras.lede"></p>
    <div class="choices" id="extraChoices"></div>
    <p class="note note--info" data-copy="extras.quotedNote"></p>
  </section>

  <section class="step" id="step-event" aria-labelledby="t3" hidden>
    <p class="step__eyebrow" data-eyebrow></p>
    <h2 class="step__title" id="t3" data-copy="event.title"></h2>
    <p class="step__lede" data-copy="event.lede"></p>

    <div class="field">
      <span class="field__label" data-copy="event.guestsLabel"></span>
      <div class="stepper" data-stepper="eventGuests" data-min="10" data-max="125" data-step="1">
        <button class="stepper__btn" type="button" data-delta="-1" data-copy-aria="event.guestsFewer">–</button>
        <input class="stepper__value" type="number" inputmode="numeric" data-stepper-value data-copy-aria="event.guestsLabel">
        <button class="stepper__btn" type="button" data-delta="1" data-copy-aria="event.guestsMore">+</button>
      </div>
    </div>

    <div class="field">
      <span class="field__label" data-copy="event.daysLabel"></span>
      <div class="stepper" data-stepper="eventDays" data-min="1" data-max="3" data-step="1">
        <button class="stepper__btn" type="button" data-delta="-1" data-copy-aria="event.daysFewer">–</button>
        <input class="stepper__value" type="number" inputmode="numeric" data-stepper-value data-copy-aria="event.daysLabel">
        <button class="stepper__btn" type="button" data-delta="1" data-copy-aria="event.daysMore">+</button>
      </div>
      <p class="note note--info" data-copy="event.daysNote"></p>
    </div>

    <div class="field">
      <span class="field__label" data-copy="event.styleLabel"></span>
      <div class="choices choices--split" id="styleChoices"></div>
      <p class="note note--warn" id="platedNote" hidden></p>
    </div>

    <div class="field">
      <span class="field__label" id="menuLabel" data-copy="event.menuLabel"></span>
      <div class="choices" id="menuChoices" role="radiogroup" aria-labelledby="menuLabel"></div>
      <label class="extra" id="secondEntreeField" hidden>
        <input type="checkbox" id="secondEntreeInput">
        <span class="extra__body">
          <span class="extra__title" data-copy="event.secondEntreeLabel"></span>
          <span class="extra__meta" data-copy="event.secondEntreeMeta"></span>
        </span>
      </label>
      <p class="note note--info" id="cocktailNote" hidden></p>
    </div>

    <p class="note note--brand" id="venueNote"></p>
    <p class="note note--info" id="eventFeeMinNote" hidden></p>
  </section>

  <section class="step" id="step-estimate" aria-labelledby="t5" hidden>
    <h2 class="step__title" id="t5" data-copy="estimate.title"></h2>
    <p class="topline" data-copy="estimate.topline"></p>
    <p class="step__lede" id="estimateLede"></p>

    <div class="headline">
      <p class="headline__label" data-copy="estimate.totalLabel"></p>
      <p class="headline__range" id="rangeOut">—</p>
      <p class="headline__sub" id="rangeCaption"></p>
      <div class="headline__meta" id="rangeMeta"></div>
    </div>

    <p class="note note--warn" id="estimateWarn" hidden></p>
    <div class="lever" id="leverEstimate" hidden></div>

    <details class="breakdown" id="breakdown">
      <summary><span data-copy="estimate.breakdownToggle"></span></summary>
      <div class="lines" id="lines"></div>
    </details>

    <p class="footnote" id="footnotes"></p>

    <div class="actions">
      <a class="btn btn--gold" id="mailtoBtn" href="#" data-copy="estimate.sendButton"></a>
      <button class="btn btn--ghost" id="copyBtn" type="button" data-copy="estimate.copyButton"></button>
    </div>
    <button class="btn btn--ghost btn--wide" id="estimateBack" type="button" data-copy="estimate.backButton"></button>

    <p class="disclaimer" data-copy="estimate.disclaimer"></p>
    <button class="startover" id="startOver" type="button" data-copy="estimate.startOver"></button>
  </section>
</main>

<nav class="navbar" id="navbar">
  <div class="navbar__inner">
    <button class="btn btn--ghost btn--back" id="backBtn" type="button" data-copy="nav.back"></button>
    <button class="btn btn--primary" id="nextBtn" type="button"></button>
  </div>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* =================================================================
   PRICES — every number London needs to edit lives in this object.
   All USD, all before GCT unless a line says otherwise.
   ================================================================= */
const PRICES = {

  /* ---- Seasons -------------------------------------------------
     `range` is [startMonthDay, endMonthDay] as MMDD integers.
     `tiers` picks which stayer-tier bands apply (see tierBreaks).
     `nightly` / `weekly` are indexed by tier.                     */
  seasons: {
    high: {
      label: "High season",
      window: "7 Jan – 13 Apr",
      minNights: 3,
      tiers: "std",
      nightly: [3843, 4573, 4819, 5599]
      /* weekly: [24230, 28830, 30390, 34890] — the Information Pack p.1 prints a Weekly Rates
         column, but NO document states how to pro-rate it. The invoice
         (Statement p.1) instead charges the nightly rate and applies a
         14% direct-booking discount, so that is what we do. Kept here in
         case London confirms a weekly-rate rule. */
    },
    low: {
      label: "Low season",
      window: "14 Apr – 22 Nov",
      minNights: 2,
      tiers: "std",
      nightly: [2853, 3563, 3829, 4539]
      /* weekly: [17930, 22430, 24090, 28590] — the Information Pack p.1 prints a Weekly Rates
         column, but NO document states how to pro-rate it. The invoice
         (Statement p.1) instead charges the nightly rate and applies a
         14% direct-booking discount, so that is what we do. Kept here in
         case London confirms a weekly-rate rule. */
    },
    lowDec: {
      label: "Low season (early December)",
      window: "1 – 14 Dec",
      minNights: 3,
      tiers: "std",
      nightly: [2853, 3563, 3829, 4539]
      /* weekly: [17930, 22430, 24090, 28430] — the Information Pack p.1 prints a Weekly Rates
         column, but NO document states how to pro-rate it. The invoice
         (Statement p.1) instead charges the nightly rate and applies a
         14% direct-booking discount, so that is what we do. Kept here in
         case London confirms a weekly-rate rule. */
    },
    thanksgiving: {
      label: "Thanksgiving",
      window: "23 – 30 Nov",
      minNights: 5,
      tiers: "holiday",
      nightly: [4523, 5579]
      /* weekly: [31490, 35090] — the Information Pack p.1 prints a Weekly Rates
         column, but NO document states how to pro-rate it. The invoice
         (Statement p.1) instead charges the nightly rate and applies a
         14% direct-booking discount, so that is what we do. Kept here in
         case London confirms a weekly-rate rule. */
    },
    christmas: {
      label: "Christmas & New Year",
      window: "15 Dec – 6 Jan",
      minNights: 7,
      tiers: "holiday",
      nightly: [6865, 7845]
      /* weekly: [48055, 54915] — the Information Pack p.1 prints a Weekly Rates
         column, but NO document states how to pro-rate it. The invoice
         (Statement p.1) instead charges the nightly rate and applies a
         14% direct-booking discount, so that is what we do. Kept here in
         case London confirms a weekly-rate rule. */
    }
  },

  /* Upper bound of each stayer tier. std = 1-7 / 8-11 / 12-15 / 16-20 */
  tierBreaks: { std: [7, 11, 15, 20], holiday: [11, 20] },
  tierLabels: {
    std: ["1–7 guests", "8–11 guests", "12–15 guests", "16–20 guests"],
    holiday: ["1–11 guests", "12–20 guests"]
  },

  /* The stay length at which the direct-booking discount and the event-fee
     waiver both kick in. Statement p.1 applies the discount to a 7-night
     stay; Wedding pack p.10 waives the event fee at "7+ days". */
  weekFromNights: 7,

  /* Source: Statement p.1, "Weekly Discounted Rate of 14% Off Entire Stay
     (for direct bookings only)".
     Applied AFTER the nightly rate x nights and the over-20 surcharge,
     and BEFORE both GCT and gratuity — see the gratuity note below. */
  directBookingDiscount: { rate: 0.14, fromNights: 7 },

  /* Guests beyond the included 20 */
  extraGuest: { includedUpTo: 20, perNight: 95, childPerNight: 65 },

  /* R1 — included in the nightly rate on EVERY booking, with or without a
     meal plan. London's inquiry email: "we offer complimentary daily
     breakfast, arrival transportation and a welcome drink that is included
     in the rate." Displayed, never charged. */
  alwaysIncluded: [
    "Daily breakfast, prepared by the chef",
    "Arrival transportation",
    "A welcome drink"
  ],

  /* Meal plan, per overnight guest per night.
     `barIncluded` decides whether drinks are inside the plan or land on a
     separate bill at check-out — see R2. */
  mealPlans: {
    ai: {
      label: "All-Inclusive",
      bestFor: "Best for groups who want everything — meals, snacks and drinks — handled from arrival.",
      adults: 239, teens: 169, kids: 99, under5: 0,
      description: "",
      barIncluded: true,
      corkage: 0
    },
    gourmet: {
      label: "Gourmet",
      bestFor: "Best for groups who want chef-prepared food at a fixed price, and who are happy to settle the bar separately.",
      adults: 123, teens: 123, kids: 62, under5: 0,
      description: "",
      /* R2 — food only. Every drink is bought from Silent Waters' inventory
         and billed at the end of the stay. This is NOT estimated anywhere in
         this tool: an understated bar tab is the most damaging thing the page
         could do. It is disclosed as a line with no amount instead. */
      barIncluded: false,
      barDisclosure: "Bar bill — not included, billed at check-out",
      barDetail: "Gourmet covers food only. All wine, liquor, soft drinks and bottled water must be bought from Silent Waters' inventory and are billed separately when you check out. We have deliberately not estimated it — for a wedding party it is not a small number.",
      corkage: 15,
      corkageNote: "Corkage is $15 per bottle brought to the villa."
    }
  },

  /* Event fee by length of stay. First matching band wins. */
  eventFeeByNights: [
    { upToNights: 1, fee: 8750 },
    { upToNights: 2, fee: 5450 },
    { upToNights: 4, fee: 2950 },
    { upToNights: 6, fee: 1950 },
    { upToNights: Infinity, fee: 0 }
  ],
  /* London meeting 2026-08-24: "events under 20 guests are not charged an
     event fee." This REPLACES the old waiver, which keyed off the number of
     outside visitors. Note: on the recording London also restated the
     historical rule — "the rule is if there's no more than six visiting
     guests" [17:09] — but the under-20 threshold governs, per Chad's
     meeting notes. Assumption: exactly 20 guests IS charged. */
  eventFeeMinGuests: 20,

  /* Event menus, per person */
  eventStyles: {
    plated: {
      label: "Plated",
      bestFor: "Seated service, capped at 30 guests.",
      cap: 30,
      description: "",
      menus: [
        { key: "extraordinaire", label: "Extraordinaire", price: 137, description: "" },
        { key: "elegante",       label: "Elegante",       price: 115, description: "" },
        { key: "grande",         label: "Grande",         price: 97, description: "" }
      ]
    },
    buffet: {
      label: "Buffet",
      bestFor: "Stations and platters, works at any size.",
      cap: 125,
      description: "",
      /* London recording, [12:28-12:45]: about 70% of couples add a second
         protein — "that's $15 a person". Optional toggle, buffet only. */
      secondEntreePerPerson: 15,
      menus: [
        { key: "empress", label: "Empress", price: 127, description: "" },
        /* $107 CONFIRMED — London recording, [10:42]: "we increased"; the
           $89 in the brochure's worked example was the stale price. */
        { key: "regatta", label: "Regatta", price: 107, description: "" },
        { key: "reggae",  label: "Reggae",  price: 89, description: "" }
      ]
    },
    /* Hors d'oeuvres. MANDATORY for every event, whatever the service
       style — London recording, [54:03-54:19]: "it has to be no choice,
       they're mandatory" (guests are otherwise drinking on empty stomachs
       while the photos run long). Four sets per 30 guests: 30 people = 4
       sets, 60 = 8, 120 = 16 [54:23, 58:03-58:45].

       TODO: $110 per set is a working average — the menu prices each set
       individually ("it's all different pricing", [58:11]). Replace with
       real set pricing when London picks the selections.

       Assumption: sets = ceil(guests / 30) x 4, so 50 guests is 8 sets. */
    cocktail: {
      label: "Cocktail",
      bestFor: "Hors d'oeuvres, standing and roaming.",
      cap: 125,
      description: "",
      setPrice: 110,
      setsPerBlock: 4,
      guestsPerBlock: 30,
      menus: []
    }
  },

  /* Beverages are NOT estimated anywhere in this tool.
     The wedding beverage menu (Menu Options pack p.4-8) is priced strictly
     by the bottle and the case — roughly 60 line items — and no document in
     the set gives a per-person bar rate or a bar package price. The $45 per
     person per event day that used to sit here was invented and has been
     removed. The bar is disclosed as a line with no amount instead. */

  /* London recording, [48:43-49:27]: on an event day, staying guests come
     OFF the meal plan (one meal-plan day subtracted per event day), are
     charged the Gourmet lunch instead, and the event dinner then covers
     everyone. "we charge them $44 for lunch ... they're getting overcharged
     right now ... paying for the regatta dinner plus the normal
     [All-Inclusive] dinner."
     Rate is the Gourmet lunch from Info p.8. Assumption: charged per
     staying guest aged 5+, either plan; under-5s stay free as everywhere
     else. */
  eventDayLunchPerGuest: 44,

  /* The event day is catered a la carte from the wedding menus for EVERY
     attendee, staying and visiting alike.
     London, 2026-08-23: "as we have always done in the past" — nobody buys

/**
 * Fills the {blanks} in a COPY string.
 * t("Minimum stay {min} nights", { min: 3 }) -> "Minimum stay 3 nights"
 */
function t(template, vars) {
  if (template == null) return "";
  return String(template).replace(/\{(\w+)\}/g, (whole, key) =>
    vars && Object.prototype.hasOwnProperty.call(vars, key) ? String(vars[key]) : whole);
}

/** "1 night" / "7 nights" — picks the right word from COPY.common. */
function plural(n, one, many) {
  return n + " " + (n === 1 ? one : many);
}

/* =================================================================
   Pricing engine
   ================================================================= */
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
const toInt = (v, fallback) => {
  const n = parseInt(v, 10);
  return Number.isFinite(n) ? n : fallback;
};

/** Season key for a check-in date (ISO yyyy-mm-dd). */
function seasonFor(iso) {
  if (!iso) return null;
  const parts = String(iso).split("-").map(Number);
  if (parts.length < 3 || parts.some(n => !Number.isFinite(n))) return null;
  const md = parts[1] * 100 + parts[2];
  if (md >= 1215 || md <= 106) return "christmas";
  if (md >= 1201 && md <= 1214) return "lowDec";
  if (md >= 1123 && md <= 1130) return "thanksgiving";
  if (md >= 107 && md <= 413) return "high";
  return "low";
}

/** ISO date, n nights later. */
function addNights(iso, n) {
  const t = Date.parse(iso + "T00:00:00Z");
  if (!Number.isFinite(t)) return "";
  return new Date(t + n * 86400000).toISOString().slice(0, 10);
}

/** Whole nights between two ISO dates. */
function nightsBetween(inIso, outIso) {
  if (!inIso || !outIso) return 0;
  const a = Date.parse(inIso + "T00:00:00Z");
  const b = Date.parse(outIso + "T00:00:00Z");
  if (!Number.isFinite(a) || !Number.isFinite(b)) return 0;
  return Math.max(0, Math.round((b - a) / 86400000));
}

/** Index into a season's nightly/weekly arrays for a stayer count. */
function tierIndexFor(seasonKey, stayers) {
  const season = PRICES.seasons[seasonKey];
  const breaks = PRICES.tierBreaks[season.tiers];
  for (let i = 0; i < breaks.length; i++) {
    if (stayers <= breaks[i]) return i;
  }
  return breaks.length - 1;
}

/**
 * How many guests may sleep at the estate.
 * 24 as standard; 28 once eight or more of the party are children aged
 * 5-12, who double up in the queen sofa beds (London, 2026-08-23).
 */
function maxStayersFor(kids) {
  const o = PRICES.occupancy;
  return kids >= o.extendedWhenKidsAtLeast ? o.extendedMax : o.standardMax;
}

/** Venue chosen automatically from the event guest count. */
function venueFor(eventGuests) {
  return PRICES.venues.find(v => eventGuests <= v.upTo) ||
         PRICES.venues[PRICES.venues.length - 1];
}

/** Which staffing band an event guest count falls in. */
function staffBandFor(eventGuests) {
  const i = PRICES.staff.bands.findIndex(b => eventGuests <= b.upTo);
  return i < 0 ? PRICES.staff.bands.length - 1 : i;
}

/**
 * The whole team on duty for one event day, base team included.
 * London meeting 2026-08-24. Returns [] below the minimum guest count.
 */
function eventStaffRoster(eventGuests) {
  if (eventGuests < PRICES.staff.minGuests) return [];
  const band = staffBandFor(eventGuests);
  return PRICES.staff.roles
    .map(r => ({ role: r.role, qty: r.totals[band], rate: r.rate }))
    .filter(r => r.qty > 0);
}

function rosterCost(list) {
  return list.reduce((sum, r) => sum + r.qty * r.rate, 0);
}

/** Hors d'oeuvres sets for a head count: four per 30 guests, rounded up. */
function horsDoeuvresSets(eventGuests) {
  const c = PRICES.eventStyles.cocktail;
  return Math.ceil(eventGuests / c.guestsPerBlock) * c.setsPerBlock;
}

/** Collapse repeated roles so the large add-on reads as one roster. */
function mergeRoster(list) {
  const merged = [];
  list.forEach(r => {
    const found = merged.find(m => m.role === r.role && m.rate === r.rate);
    if (found) found.qty += r.qty;
    else merged.push({ role: r.role, qty: r.qty, rate: r.rate });
  });
  return merged;
}

function eventFeeBaseFor(nights) {
  const band = PRICES.eventFeeByNights.find(b => nights <= b.upToNights);
  return band ? band.fee : 0;
}

/**
 * The single source of truth for the estimate.
 * @param {object} input see DEFAULTS for the shape
 */
function calcQuote(input) {
  const inp = Object.assign({}, DEFAULTS, input || {});

  const adults  = Math.max(0, toInt(inp.adults, 0));
  const teens   = Math.max(0, toInt(inp.teens, 0));
  const kids    = Math.max(0, toInt(inp.kids, 0));
  const under5  = Math.max(0, toInt(inp.under5, 0));
  const stayers = adults + teens + kids + under5;

  const nights     = nightsBetween(inp.checkIn, inp.checkOut);
  const seasonKey  = seasonFor(inp.checkIn);
  const season     = seasonKey ? PRICES.seasons[seasonKey] : null;
  const minNights  = season ? season.minNights : 0;
  const belowMin   = Boolean(season) && nights > 0 && nights < minNights;

  /* The event section is skippable — a stay-only quote is a first-class
     result (London meeting 2026-08-24). */
  const hasEvent    = inp.hasEvent !== false;
  const eventDays   = hasEvent ? clamp(toInt(inp.eventDays, 1), 1, 3) : 0;
  const eventGuests = hasEvent ? clamp(toInt(inp.eventGuests, 10), 10, 125) : 0;
  const styleKey    = PRICES.eventStyles[inp.eventStyle] ? inp.eventStyle : "buffet";
  const style       = PRICES.eventStyles[styleKey];

  /* ---- menu / selections -------------------------------------------
     Plated and buffet are per person. Cocktail is per SELECTION of 30
     pieces with a minimum of four (Menu Options pack p.3) — never per
     person. The two are priced by different functions below. */
  const isCocktail = styleKey === "cocktail";
  const menu = isCocktail ? null
    : (style.menus.find(m => m.key === inp.menuKey) || style.menus[0]);
  const menuPrice = menu ? menu.price : 0;

  /* Hors d'oeuvres are mandatory for every event (London recording,
     [54:03-54:19]), so the sets are computed whatever the style. */
  const sets = hasEvent ? horsDoeuvresSets(eventGuests) : 0;

  /* ---- accommodation --------------------------------------------- */
  let accommodationBase = 0;
  let rateBasis = "";
  if (season && nights > 0) {
    const tier = tierIndexFor(seasonKey, stayers);
    accommodationBase = season.nightly[tier] * nights;
    rateBasis = "$" + season.nightly[tier].toLocaleString("en-US") + " × " + nights +
      (nights === 1 ? " night" : " nights");
  }

  /* Guests past the included 20 are billed per night. We do not know
     which individuals are "the extras", so the surcharge is blended
     across the party by headcount share. */
  const overflow = Math.max(0, stayers - PRICES.extraGuest.includedUpTo);
  let overflowCost = 0;
  if (overflow > 0 && stayers > 0 && nights > 0) {
    const children = kids + under5;
    const grown = adults + teens;
    const blended = (grown / stayers) * PRICES.extraGuest.perNight +
                    (children / stayers) * PRICES.extraGuest.childPerNight;
    overflowCost = overflow * blended * nights;
  }
  /* Statement p.1: the invoice charges the nightly rate for the whole stay
     and then takes 14% off for direct bookings of a week or more. The
     discount lands on the accommodation subtotal including the over-20
     surcharge, and both GCT and gratuity are computed on the discounted
     figure. */
  const preDiscount = r2(accommodationBase + overflowCost);
  const discountApplies = nights >= PRICES.directBookingDiscount.fromNights;
  const discount = discountApplies
    ? r2(preDiscount * PRICES.directBookingDiscount.rate)
    : 0;
  const accommodation = r2(preDiscount - discount);

  /* ---- meal plan -------------------------------------------------- */
  /* London meeting 2026-08-24: the event day carries its own menu, so the
     meal plan is charged for the nights that are not event days. Floored at
     zero — a one-night stay with a one-day event has no meal-plan nights. */
  const planKey = PRICES.mealPlans[inp.mealPlan] ? inp.mealPlan : "ai";
  const plan = PRICES.mealPlans[planKey];
  const mealPlanNights = Math.max(0, nights - eventDays);
  const mealPlan = r2(mealPlanNights * (
    adults * plan.adults + teens * plan.teens + kids * plan.kids + under5 * plan.under5
  ));

  /* ---- event fee -------------------------------------------------- */
  /* Wedding pack p.10: "Our event fee is based on the number of days you
     will be staying at the villa either before and/or after your special
     event." One fee per stay — NOT one per event day. The previous
     multiplication by eventDays had no source and has been removed.
     Waived at 7+ (Wedding pack p.10, Info p.21) or when visitors number six
     or fewer (Wedding pack p.10: "waived if the only people in attendance
     are those staying at the villa or up to six outside visitors"). */
  const feeBase = eventFeeBaseFor(nights);
  const waivedByStay = nights >= PRICES.weekFromNights || feeBase === 0;
  /* London meeting 2026-08-24: no event fee under 20 guests. Replaces the
     old "six or fewer outside visitors" waiver. */
  const waivedBySize = eventGuests < PRICES.eventFeeMinGuests;
  const eventFeeWaived = !hasEvent || nights === 0 || waivedByStay || waivedBySize;
  const eventFee = eventFeeWaived ? 0 : r2(feeBase);

  /* ---- event food --------------------------------------------------
     Catered a la carte from the wedding menus (Menu Options pack p.1-3)
     for every attendee, staying and visiting alike. One number, not a
     range — London, 2026-08-23. */
  const setPrice = PRICES.eventStyles.cocktail.setPrice;
  const horsDoeuvres = hasEvent ? r2(sets * setPrice * eventDays) : 0;

  /* For a cocktail reception the hors d'oeuvres ARE the menu, so the
     dinner line is zero rather than double-counting the sets. */
  const eventFood = !hasEvent || isCocktail
    ? 0
    : r2(menuPrice * eventGuests * eventDays);

  /* London recording, [12:28-12:45]: optional second entrée on buffets,
     $15 per person — about 70% of couples take it. */
  const secondEntree = hasEvent && styleKey === "buffet" && inp.secondEntree === true;
  const secondEntreeCost = secondEntree
    ? r2(PRICES.eventStyles.buffet.secondEntreePerPerson * eventGuests * eventDays)
    : 0;

  /* London recording, [48:43-49:27]: staying guests come off the meal plan
     on the event day and are charged the Gourmet lunch instead; the event
     dinner then covers everyone. Under-5s stay free. */
  const lunchGuests = Math.max(0, stayers - under5);
  const eventDayLunch = hasEvent
    ? r2(PRICES.eventDayLunchPerGuest * lunchGuests * eventDays)
    : 0;

  /* ---- bar --------------------------------------------------------
     R2: on Gourmet the bar is NOT estimated. Drinks are bought from the
     villa's inventory and billed at check-out, so the line carries a
     disclosure and no amount. On All-Inclusive the staying guests' drinks
     are inside the plan and only visiting guests are estimated. */
  /* No document in the set prices a bar per person. The wedding beverage
     menu (Menu Options pack p.4-8) is by the bottle and the case only, so
     the bar carries NO number on either plan — it is disclosed instead. */
  const visitingGuests = Math.max(0, eventGuests - stayers);
  const barIncluded = plan.barIncluded === true;
  const bar = 0;
  const barDisclosureLine = barIncluded ? COPY.bar.eventQuoted : plan.barDisclosure;
  const barNote = barIncluded
    ? t(COPY.bar.allInclusiveNote, {
        visitors: plural(visitingGuests, COPY.common.guest, COPY.common.guests) })
    : plan.barDetail;

  /* ---- extra event staff ------------------------------------------ */
  const staffRoster = hasEvent ? eventStaffRoster(eventGuests) : [];
  const staffPerDay = rosterCost(staffRoster);
  const staffBand = hasEvent && staffRoster.length
    ? PRICES.staff.bands[staffBandFor(eventGuests)].label : "";
  const staff = r2(staffPerDay * eventDays);

  /* ---- extras ------------------------------------------------------ */
  const chosen = inp.extras || {};
  const extrasDetail = [];
  PRICES.extras.forEach(x => {
    if (!chosen[x.key]) return;
    /* Items Silent Waters prices on request carry no figure and add
       nothing to the total (London meeting 2026-08-24). */
    if (x.quoted) {
      extrasDetail.push({
        key: x.key, label: x.label, meta: x.meta, units: 1, quoted: true, amount: 0
      });
      return;
    }
    const units = x.per === "night" ? nights : x.per === "eventDay" ? eventDays : 1;
    extrasDetail.push({
      key: x.key, label: x.label, meta: x.meta, units: units, per: x.per,
      quoted: false, amount: r2(x.price * units)
    });
  });
  const quotedExtras = extrasDetail.filter(x => x.quoted);
  const extras = r2(extrasDetail.reduce((sum, x) => sum + x.amount, 0));

  /* ---- tax, gratuity, deposit --------------------------------------
     GCT covers accommodation (Statement p.1 "Government Tax"), meal plans,
     event food, extras AND the event fee (Info p.20 #4: "plus a 10% GCT").
     Gratuity is 20% of the POST-discount, pre-tax accommodation, per
     Statement p.1. */
  /* Two groups, one combined total (London meeting 2026-08-24). Extras
     belong to the Stay. */
  const stayTotal = r2(accommodation + mealPlan + extras);
  const eventTotal = r2(eventFee + eventFood + horsDoeuvres + secondEntreeCost +
                        eventDayLunch + staff);
  const gct = r2((accommodation + mealPlan + eventFee + extras + eventFood +
                  horsDoeuvres + secondEntreeCost + eventDayLunch) * PRICES.gct);

  /* Gratuity is NOT collected up front and is NOT part of the total.
     London, 2026-08-23: it is paid in cash at check-out. We illustrate the
     customary amount so nobody is surprised by it, the same way the
     refundable deposit is shown. */
  const gratuity = r2(accommodation * PRICES.gratuity);
  const gratuityOnCard = r2(accommodation * PRICES.gratuityOnCard);
  const deposit = PRICES.damageDeposit;

  const total = r2(stayTotal + eventTotal + gct);

  const venue = venueFor(eventGuests);
  const platedOverCap = hasEvent && styleKey === "plated" && eventGuests > style.cap;

  return {
    /* context */
    input: inp,
    checkIn: inp.checkIn,
    checkOut: inp.checkOut,
    nights: nights,
    seasonKey: seasonKey,
    seasonLabel: season ? season.label : "",
    seasonWindow: season ? season.window : "",
    minNights: minNights,
    belowMinimum: belowMin,
    stayers: stayers,
    counts: { adults: adults, teens: teens, kids: kids, under5: under5 },
    maxStayers: maxStayersFor(kids),
    occupancyExtended: kids >= PRICES.occupancy.extendedWhenKidsAtLeast,
    overCapacity: stayers > maxStayersFor(kids),
    eventGuests: eventGuests,
    eventDays: eventDays,
    visitingGuests: visitingGuests,
    styleKey: styleKey,
    styleLabel: style.label,
    menuKey: menu ? menu.key : "cocktail",
    menuLabel: menu ? menu.label : COPY.bar.cocktailMenuLabel,
    menuPrice: menuPrice,
    mealPlanKey: planKey,
    mealPlanLabel: plan.label,
    alwaysIncluded: PRICES.alwaysIncluded.slice(),
    barIncluded: barIncluded,
    barDisclosure: barDisclosureLine,
    barDetail: barIncluded ? "" : plan.barDetail,
    corkage: plan.corkage || 0,
    corkageNote: plan.corkageNote || "",
    platedOverCap: platedOverCap,
    venue: hasEvent ? venue.label : "",
    venueNote: hasEvent ? venue.note : "",
    venueSource: hasEvent ? venue.source : "",
    rateBasis: rateBasis,
    barNote: barNote,
    eventFeeWaived: eventFeeWaived,
    eventFeeBase: feeBase,
    staffPerDay: staffPerDay,
    staffRoster: staffRoster,
    extrasDetail: extrasDetail,

    /* money, pre-tax */
    lines: {
      accommodation: accommodation,
      mealPlan: mealPlan,
      eventFee: eventFee,
      eventFood: eventFood,
      bar: bar,
      staff: staff,
      extras: extras
    },
    accommodationPreDiscount: preDiscount,
    accommodationDiscount: discount,
    discountApplies: discountApplies,
    discountRate: PRICES.directBookingDiscount.rate,
    accommodationOverflow: r2(overflowCost),

    hasEvent: hasEvent,
    horsDoeuvres: horsDoeuvres,
    secondEntree: secondEntree,
    secondEntreeCost: secondEntreeCost,
    eventDayLunch: eventDayLunch,
    lunchGuests: lunchGuests,
    /* Free shuttle whenever an event fee is actually charged —
       London recording, [30:00]. */
    shuttleIncluded: hasEvent && !eventFeeWaived,
    stayTotal: stayTotal,
    eventTotal: eventTotal,
    mealPlanNights: mealPlanNights,
    staffBand: staffBand,
    baseTeam: PRICES.staff.baseTeam.slice(),
    quotedExtras: quotedExtras,
    eventFeeMinGuests: PRICES.eventFeeMinGuests,
    belowEventFeeMinimum: hasEvent && eventGuests < PRICES.eventFeeMinGuests,

    /* cocktail specifics */
    isCocktail: isCocktail,
    sets: sets,
    setPrice: setPrice,

    /* money, with the 10% GCT folded in — handy for cross-checking
       against the info pack, which quotes tax-inclusive figures */
    withGct: {
      accommodation: r2(accommodation * (1 + PRICES.gct)),
      mealPlan: r2(mealPlan * (1 + PRICES.gct)),
      eventFood: r2(eventFood * (1 + PRICES.gct)),
      eventFee: r2(eventFee * (1 + PRICES.gct)),
      extras: r2(extras * (1 + PRICES.gct))
    },

    gct: gct,
    gratuity: gratuity,
    gratuityOnCard: gratuityOnCard,
    gratuityInTotal: false,
    deposit: deposit,
    total: total
  };
}

/**
 * R6 — the event fee is waived at 7 nights and London's biggest lever.
 * For a 5- or 6-night stay, work out what extending actually does: the
 * fee comes off, but extra nights of accommodation and meals go on. We
 * report the real net figure rather than just the headline saving, so
 * the nudge stays honest whichever way it lands.
 */
function sevenNightLever(input) {
  const now = calcQuote(input);
  if (now.nights < 5 || now.nights > 6) return { applies: false };
  if (now.lines.eventFee <= 0) return { applies: false };

  const checkOut = addNights(input.checkIn, PRICES.weekFromNights);
  if (!checkOut) return { applies: false };

  const extended = calcQuote(Object.assign({}, input, { checkOut: checkOut }));
  const delta = r2(extended.total - now.total);

  return {
    applies: true,
    nights: now.nights,
    extraNights: PRICES.weekFromNights - now.nights,
    checkOut: checkOut,
    feeWaived: now.lines.eventFee,
    currentTotal: now.total,
    extendedTotal: extended.total,
    delta: delta,
    cheaper: delta < 0
  };
}

/* =================================================================
   Date picker — pure model
   -----------------------------------------------------------------
   The native <input type="date"> pair let a check-out sit before a
   check-in (it defaulted to today, so an October check-in showed an
   August check-out). These functions replace it. They are pure: no DOM,
   no clock beyond the `todayIso` you hand them, so the tests can drive
   them directly.

   The load-bearing guarantee is in pickerReduce: it can never return a
   selection whose checkOut is on or before its checkIn. Every date that
   reaches calcQuote comes through it.
   ================================================================= */

/**
 * Expands the BLOCKED list (singles and [start, checkout] ranges) into a
 * Set of blocked NIGHTS. A range's end date is the checkout day and is
 * NOT blocked — a new stay may check in that day.
 */
function expandBlocked(list) {
  const nights = new Set();
  (list || []).forEach(entry => {
    if (typeof entry === "string") {
      if (entry) nights.add(entry);
      return;
    }
    if (Array.isArray(entry) && entry[0] && entry[1]) {
      let d = entry[0];
      /* hard stop guards a backwards range from looping forever */
      for (let i = 0; d < entry[1] && i < 1000; i++) {
        nights.add(d);
        d = addNights(d, 1);
      }
    }
  });
  return nights;
}

/* The live set: the hand-edited BLOCKED list, plus whatever the sync job
   published as blocked-dates.json (Level 2). Rebuilt by applyBlockedDates. */
let BLOCKED_SET = null; /* built after addNights exists — see boot */

/**
 * Replace the runtime blocked set: the union of the manual list and any
 * fetched nights. Also the test seam.
 */
function applyBlockedDates(fetchedNights) {
  BLOCKED_SET = expandBlocked(BLOCKED);
  (fetchedNights || []).forEach(n => {
    if (typeof n === "string" && /^\d{4}-\d{2}-\d{2}$/.test(n)) BLOCKED_SET.add(n);
  });
  return BLOCKED_SET;
}

/** Is this NIGHT unavailable? (A checkout on this date may still be fine.) */
function isNightBlocked(iso) {
  return BLOCKED_SET !== null && BLOCKED_SET.has(iso);
}

/** Does the stay [inIso, outIso) sleep on any blocked night? */
function rangeHasBlockedNight(inIso, outIso) {
  let d = inIso;
  for (let i = 0; d < outIso && i < 1000; i++) {
    if (isNightBlocked(d)) return true;
    d = addNights(d, 1);
  }
  return false;
}

/** Today as yyyy-mm-dd, in local time. */
function todayIso(now) {
  const d = now || new Date();
  const pad = n => (n < 10 ? "0" : "") + n;
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}

/** Minimum nights the season of `iso` demands. */
function minNightsForDate(iso) {
  const key = seasonFor(iso);
  return key ? PRICES.seasons[key].minNights : 0;
}

/**
 * Which of the picker's THREE states a selection is in. There is no
 * fourth: no preview, no "tap to confirm". A forward second tap goes
 * straight from awaiting-checkout to complete.
 */
function pickerPhase(sel) {
  const inIso = (sel && sel.checkIn) || "";
  const outIso = (sel && sel.checkOut) || "";
  if (!inIso) return "empty";
  return outIso ? "complete" : "awaiting-checkout";
}

/**
 * The whole picker interaction, as one pure step.
 * @param {{checkIn:string, checkOut:string}} sel current selection
 * @param {string} dateIso the day that was tapped
 * @returns {{checkIn:string, checkOut:string}} the next selection
 */
function pickerReduce(sel, dateIso) {
  const inIso = (sel && sel.checkIn) || "";
  const outIso = (sel && sel.checkOut) || "";

  /* A blocked night can never be slept on, so it can never become a
     check-in. The UI disables these cells; the model refuses them too. */
  if (isNightBlocked(dateIso)) return { checkIn: inIso, checkOut: outIso };

  /* Nothing chosen yet, or a finished range: this tap starts a new one. */
  if (!inIso || outIso) return { checkIn: dateIso, checkOut: "" };

  /* Awaiting a check-out. A tap on or before the check-in restarts from
     that day rather than producing a backwards range. */
  if (dateIso <= inIso) return { checkIn: dateIso, checkOut: "" };

  /* A stay may not span a booked night. A tap beyond one restarts the
     selection from the tapped day instead of completing the range. */
  if (rangeHasBlockedNight(inIso, dateIso)) {
    return { checkIn: dateIso, checkOut: "" };
  }

  /* Below the season minimum — the cell is disabled in the UI, but guard
     it here too so the model holds on its own. */
  if (nightsBetween(inIso, dateIso) < minNightsForDate(inIso)) {
    return { checkIn: inIso, checkOut: "" };
  }

  return { checkIn: inIso, checkOut: dateIso };
}

/** What one day cell should look like. Pure. */
function pickerDayFlags(dateIso, sel, today) {
  const inIso = (sel && sel.checkIn) || "";
  const outIso = (sel && sel.checkOut) || "";
  const awaitingOut = Boolean(inIso) && !outIso;
  const isPast = dateIso < today;
  const isBlocked = isNightBlocked(dateIso);
  const nights = inIso && dateIso > inIso ? nightsBetween(inIso, dateIso) : 0;
  const belowMinimum = awaitingOut && dateIso > inIso &&
    nights < minNightsForDate(inIso);

  return {
    disabled: isPast || belowMinimum || isBlocked,
    isBlocked: isBlocked,
    isPast: isPast,
    belowMinimum: belowMinimum,
    isCheckIn: Boolean(inIso) && dateIso === inIso,
    isCheckOut: Boolean(outIso) && dateIso === outIso,
    inRange: Boolean(inIso && outIso) && dateIso > inIso && dateIso < outIso,
    isToday: dateIso === today,
    nights: nights,
    /* The stay-length lever: from this night on, the event fee is waived. */
    isSeventhNight: awaitingOut && nights === PRICES.weekFromNights
  };
}

/** The days of a month as ISO strings, padded to whole weeks with "". */
function monthGrid(year, monthIndex) {
  const first = new Date(Date.UTC(year, monthIndex, 1));
  const lead = first.getUTCDay();
  const days = new Date(Date.UTC(year, monthIndex + 1, 0)).getUTCDate();
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push("");
  const pad = n => (n < 10 ? "0" : "") + n;
  for (let d = 1; d <= days; d++) {
    cells.push(year + "-" + pad(monthIndex + 1) + "-" + pad(d));
  }
  while (cells.length % 7 !== 0) cells.push("");
  return cells;
}

/** "Oct 20 – Oct 27 · 7 nights", or "" when incomplete. Pure. */
function pickerSummary(sel) {
  const inIso = (sel && sel.checkIn) || "";
  const outIso = (sel && sel.checkOut) || "";
  if (!inIso) return "";
  const short = iso => {
    const t = Date.parse(iso + "T12:00:00Z");
    return new Date(t).toLocaleDateString("en-US",
      { month: "short", day: "numeric", timeZone: "UTC" });
  };
  if (!outIso) return t(COPY.calendar.summaryAwaiting, { start: short(inIso) });
  const n = nightsBetween(inIso, outIso);
  return t(COPY.calendar.summaryComplete, {
    start: short(inIso), end: short(outIso),
    nights: plural(n, COPY.common.night, COPY.common.nights)
  });
}

/* =================================================================
   State
   ================================================================= */
const DEFAULTS = {
  checkIn: "", checkOut: "",
  adults: 2, teens: 0, kids: 0, under5: 0,
  mealPlan: "ai",
  eventGuests: 50, eventDays: 1,
  eventStyle: "buffet", menuKey: "regatta",
  secondEntree: false,
  hasEvent: true,
  extras: { massage: false, rumTasting: false, reggaeBand: false, mentoBand: false,
            yacht: false, vipBeach: false },
  screen: "intro"
};

/* The screens, in order. `section` groups them for the progress label;
   the intro and the estimate sit outside the numbering.
   London meeting 2026-08-24: Stay and Event, with Event skippable. */
const SCREENS = [
  { id: "intro",    section: "" },
  { id: "dates",    section: "stay" },
  { id: "guests",   section: "stay" },
  { id: "meal",     section: "stay" },
  { id: "extras",   section: "stay" },
  { id: "event",    section: "event" },
  { id: "estimate", section: "" }
];

/** The screens this quote actually visits — Event drops out on stay-only. */
function activeScreens() {
  return SCREENS.filter(sc => sc.id !== "event" || state.hasEvent !== false);
}

/** Numbered input screens, i.e. everything but the intro and the estimate. */
function inputScreens() {
  return activeScreens().filter(sc => sc.section !== "");
}

function screenIndex(id) {
  return activeScreens().findIndex(sc => sc.id === id);
}

const STORAGE_KEY = "silent-waters-quote-v1";

/* Saved dates go stale. Someone who opened the page last week should not
   come back to last week's dates still sitting in the field. */
const DATE_TTL_MS = 24 * 60 * 60 * 1000;

/* Date pairs an earlier build seeded by default. Discarded on sight,
   however recently they were saved. */
const LEGACY_SEEDED_DATES = [
  { checkIn: "2026-08-23", checkOut: "2026-08-25" }
];

/**
 * Decides whether stored dates may be restored. Pure — hand it the clock.
 * Only ever clears dates; every other stored answer is the caller's to keep.
 *
 * @param {object} stored  the parsed localStorage payload
 * @param {number} nowMs   current time in ms
 * @param {string} today   today as yyyy-mm-dd
 * @returns {{checkIn:string, checkOut:string, discarded:boolean, reason:string}}
 */
function reconcileStoredDates(stored, nowMs, today) {
  const src = stored || {};
  const out = {
    checkIn: src.checkIn || "",
    checkOut: src.checkOut || "",
    discarded: false,
    reason: ""
  };
  const drop = reason => ({ checkIn: "", checkOut: "", discarded: true, reason: reason });

  if (!out.checkIn) return out;

  if (LEGACY_SEEDED_DATES.some(d =>
      d.checkIn === out.checkIn && d.checkOut === out.checkOut)) {
    return drop("legacy-default");
  }
  /* A backwards pair from the old native inputs. */
  if (out.checkOut && out.checkOut <= out.checkIn) return drop("invalid-range");
  if (out.checkIn < today) return drop("past-check-in");

  const savedAt = Number(src.savedAt) || 0;
  if (!savedAt || nowMs - savedAt > DATE_TTL_MS) return drop("stale");

  return out;
}

/* Standard sleeping capacity. The cap rises to 28 with eight or more
   children aged 5-12 — see PRICES.occupancy and maxStayersFor(). */
const MAX_STAYERS = 24;
const MAX_STAYERS_ANY = 28;

const COUNT_FIELDS = [
  { key: "adults", labelKey: "guests.adults", hintKey: "guests.adultsHint" },
  { key: "teens",  labelKey: "guests.teens",  hintKey: "guests.teensHint" },
  { key: "kids",   labelKey: "guests.kids",   hintKey: "guests.kidsHint" },
  { key: "under5", labelKey: "guests.under5", hintKey: "guests.under5Hint" }
];

/* Ephemeral picker chrome — deliberately not persisted. */
/* No `hover` here on purpose. A preview state is what broke the picker on
   phones: touch fires mouseover before click, the re-render replaced the
   node under the finger, and the tap never landed on a day. */
const ui = { calOpen: false, month: "" };

let state = loadState();

/* Flush the cleaned state straight back so discarded dates really go. */
if (state.datesWereDiscarded) {
  delete state.datesWereDiscarded;
  saveState();
}

function loadState() {
  let stored = null;
  try {
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if (raw) stored = JSON.parse(raw);
  } catch (err) {
    console.warn("Could not read saved answers:", err);
  }
  const next = Object.assign({}, DEFAULTS, stored || {});
  next.extras = Object.assign({}, DEFAULTS.extras, (stored && stored.extras) || {});
  if (!SCREENS.some(sc => sc.id === next.screen)) next.screen = "intro";

  /* Dates, and only dates, may be discarded as stale. Guest counts, meal
     plan and everything else are kept whatever happens here. */
  const dates = reconcileStoredDates(stored, Date.now(), todayIso());
  next.checkIn = dates.checkIn;
  next.checkOut = dates.checkOut;
  if (dates.discarded) {
    next.screen = "intro";
    /* Marked so boot can rewrite storage without the stale dates, rather
       than leaving them to be re-discarded on every future load. */
    next.datesWereDiscarded = true;
  }
  delete next.savedAt;
  return next;
}

function saveState() {
  try {
    /* Stamped so reconcileStoredDates can tell fresh dates from stale. */
    window.localStorage.setItem(STORAGE_KEY,
      JSON.stringify(Object.assign({}, state, { savedAt: Date.now() })));
  } catch (err) {
    console.warn("Could not save answers:", err);
  }
}

function setState(patch) {
  state = Object.assign({}, state, patch);
  saveState();
  render();
}

/* =================================================================
   Formatting
   ================================================================= */
const money = new Intl.NumberFormat("en-US", {
  style: "currency", currency: "USD", maximumFractionDigits: 0
});
const money2 = new Intl.NumberFormat("en-US", {
  style: "currency", currency: "USD", minimumFractionDigits: 2, maximumFractionDigits: 2
});
function fmtDate(iso) {
  if (!iso) return "—";
  const t = Date.parse(iso + "T12:00:00Z");
  if (!Number.isFinite(t)) return iso;
  return new Date(t).toLocaleDateString("en-GB", {
    day: "numeric", month: "short", year: "numeric", timeZone: "UTC"
  });
}

/* =================================================================
   DOM helpers
   ================================================================= */
const $ = sel => document.querySelector(sel);
const $$ = sel => Array.prototype.slice.call(document.querySelectorAll(sel));
function el(tag, attrs, html) {
  const node = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(k => node.setAttribute(k, attrs[k]));
  if (html != null) node.innerHTML = html;
  return node;
}
function show(node, on) {
  if (node) node.hidden = !on;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/** COPY lookup by dotted path: copy("dates.title"). */
function copy(path) {
  return path.split(".").reduce((o, k) => (o == null ? o : o[k]), COPY);
}

/** Paints every data-copy hook in the markup. Runs once, on boot. */
function paintStatic() {
  $$("[data-copy]").forEach(node => {
    node.textContent = copy(node.getAttribute("data-copy")) || "";
  });
  $$("[data-copy-aria]").forEach(node => {
    node.setAttribute("aria-label", copy(node.getAttribute("data-copy-aria")) || "");
  });
  $("#surchargeNote").innerHTML = "<span>" +
    esc(t(COPY.guests.surchargeNote, { included: PRICES.extraGuest.includedUpTo })) + "</span>";
}

/* =================================================================
   One-time scaffolding
   ================================================================= */
/* Rebuilt on every render: the number of dots changes when the guest
   skips the event. */
function renderProgress() {
  const steps = inputScreens();
  const here = screenIndex(state.screen);
  const wrap = $("#progress");
  wrap.innerHTML = steps.map(sc => {
    const i = screenIndex(sc.id);
    const st = i === here ? "current" : (i < here ? "done" : "todo");
    return '<span class="progress__dot" data-state="' + st +
      '" data-section="' + sc.section + '"></span>';
  }).join("");
  show(wrap, state.screen !== "intro");
}

function buildCounters() {
  const wrap = $("#countgrid");
  wrap.innerHTML = "";
  COUNT_FIELDS.forEach(f => {
    const label = copy(f.labelKey), hint = copy(f.hintKey);
    const box = el("div", { class: "count" });
    box.innerHTML =
      '<span class="count__label">' + esc(label) +
      ' <span class="count__hint">' + esc(hint) + '</span></span>' +
      '<div class="stepper" data-stepper="' + f.key + '" data-min="0" data-max="' + MAX_STAYERS_ANY + '" data-step="1">' +
        '<button class="stepper__btn" type="button" data-delta="-1" aria-label="' + esc(label) + ' −">&ndash;</button>' +
        '<input class="stepper__value" type="number" inputmode="numeric" data-stepper-value aria-label="' + esc(label) + '">' +
        '<button class="stepper__btn" type="button" data-delta="1" aria-label="' + esc(label) + ' +">+</button>' +
      '</div>';
    wrap.appendChild(box);
  });
}

function buildStyleChoices() {

function buildExtras() {

/* Menu radios depend on the chosen style, so they re-render. */
function renderMenuChoices(q) {
  const wrap = $("#menuChoices");
  const style = PRICES.eventStyles[q.styleKey];
  wrap.innerHTML = "";
  style.menus.forEach(m => {
    const label = el("label", { class: "choice" });
    label.innerHTML =
      '<input type="radio" name="menuKey" value="' + m.key + '"' +
        (m.key === q.menuKey ? " checked" : "") + '>' +
      '<span class="choice__title">' + esc(m.label) + '</span>' +
      (m.description
        ? '<span class="choice__desc">' + esc(m.description) + '</span>' : '') +
      '<span class="choice__price">' + esc(t(COPY.event.perPerson, { price: m.price })) + '</span>';
    wrap.appendChild(label);
  });
  show($("#menuLabel"), !q.isCocktail);
  show($("#cocktailField"), q.isCocktail);
