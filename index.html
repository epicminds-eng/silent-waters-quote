/* =================================================================
   Render
   ================================================================= */
function render() {
  const q = calcQuote(state);

  /* steps + progress */
  SCREENS.forEach(sc => show($("#step-" + sc.id), sc.id === state.screen));
  renderProgress();
  renderEyebrows();

  /* nav */
  const screens = activeScreens();
  const here = screenIndex(state.screen);
  const onIntro = state.screen === "intro";
  const onLast = state.screen === "estimate";
  $("#backBtn").disabled = here <= 0;
  show($("#navbar"), !onIntro && !onLast);
  $("#nextBtn").textContent = here === screens.length - 2
    ? COPY.nav.seeEstimate : COPY.nav.next;
  $("#nextBtn").disabled = !canAdvance(q);

  renderDates(q);
  renderGuests(q);
  renderMeal(q);
  renderLever($("#leverDates"), sevenNightLever(state));
  renderEvent(q);
  renderExtras();
  if (onLast) renderEstimate(q);
}

function canAdvance(q) {
  if (state.screen === "dates") return q.nights > 0;
  if (state.screen === "guests") return q.stayers > 0 && !q.overCapacity;
  return true;
}

/** "Stay · Step 2 of 4" above each numbered screen. */
function renderEyebrows() {
  const steps = inputScreens();
  steps.forEach((sc, i) => {
    const node = document.querySelector("#step-" + sc.id + " [data-eyebrow]");
    if (!node) return;
    node.textContent = t(COPY.nav.stepLabel, {
      section: sc.section === "event" ? COPY.intro.sectionEvent : COPY.intro.sectionStay,
      n: i + 1, total: steps.length
    });
  });
}

const DOW = ["S", "M", "T", "W", "T", "F", "S"];

function monthLabel(year, monthIndex) {
  return new Date(Date.UTC(year, monthIndex, 1))
    .toLocaleDateString("en-US", { month: "long", year: "numeric", timeZone: "UTC" });
}

function renderCalendar() {
  const cal = $("#cal");
  show(cal, ui.calOpen);
  $("#dateField").setAttribute("aria-expanded", ui.calOpen ? "true" : "false");
  if (!ui.calOpen) return;

  const today = todayIso();
  const sel = { checkIn: state.checkIn, checkOut: state.checkOut };
  const awaitingOut = pickerPhase(sel) === "awaiting-checkout";

  const anchor = ui.month.split("-").map(Number);
  const y = anchor[0], mi = anchor[1] - 1;
  const atStart = ui.month <= (today.slice(0, 7) + "-01");

  /* Header is the month and the two arrows. Nothing else — no night
     count, no instruction, no confirmation step. Where the guest is up to
     is said once, in the field above. */
  let html =
    '<div class="cal__head">' +
      '<button type="button" class="cal__nav" data-cal-nav="-1" aria-label="' +
        esc(COPY.calendar.prevMonth) + '"' + (atStart ? " disabled" : "") + '>‹</button>' +
      '<span class="cal__title">' + esc(monthLabel(y, mi)) + '</span>' +
      '<button type="button" class="cal__nav" data-cal-nav="1" aria-label="' +
        esc(COPY.calendar.nextMonth) + '">›</button>' +
    '</div><div class="cal__grid">' +
    DOW.map(x => '<span class="cal__dow">' + x + '</span>').join("");

  monthGrid(y, mi).forEach(iso => {
    if (!iso) { html += '<span class="cal__cell"></span>'; return; }
    const f = pickerDayFlags(iso, sel, today);
    const isStart = sel.checkIn === iso;
    const isEnd = sel.checkOut === iso;
    const edge = isStart && isEnd ? "only" : isStart ? "start" : isEnd ? "end" : "";

    html += '<span class="cal__cell"' +
      (f.inRange ? ' data-in-range="1"' : "") +
      (edge && sel.checkOut ? ' data-edge="' + edge + '"' : "") + '>' +
      '<button type="button" class="cal__day" data-cal-day="' + iso + '"' +
        (f.disabled ? " disabled" : "") +
        (f.isBlocked ? ' data-blocked="1"' : "") +
        (f.isToday && !f.isBlocked ? ' data-today="1"' : "") +
        (edge ? ' data-edge="' + edge + '"' : "") +
        (f.isSeventhNight ? ' data-seventh="1"' : "") +
        ' aria-label="' + esc(fmtDate(iso)) +
          (f.isBlocked ? " — " + esc(COPY.calendar.bookedLegend) : "") + '">' +
        Number(iso.slice(8)) +
      '</button></span>';
  });

  html += '</div><p class="cal__foot">' +
    (awaitingOut
      ? '<span class="cal__legend">' + esc(COPY.calendar.feeWaivedLegend) + '</span>'
      : '<span class="cal__legend cal__legend--booked">' +
          esc(COPY.calendar.bookedLegend) + '</span>') +
    '<button type="button" class="cal__done" data-cal-close="1">' +
      esc(COPY.calendar.done) + '</button></p>';

  cal.innerHTML = html;
}

function renderDates(q) {
  const field = $("#dateField");
  const summary = pickerSummary({ checkIn: state.checkIn, checkOut: state.checkOut });
  field.classList.toggle("datefield--empty", !summary);
  $("#dateFieldValue").innerHTML = summary
    ? esc(summary).replace(/·\s([0-9]+\s+\S+)$/,
        '· <span class="datefield__nights">$1</span>')
    : esc(COPY.dates.fieldEmpty);
  renderCalendar();

  const seasonNote = $("#seasonNote");
  if (q.seasonKey) {
    const vars = {
      season: esc(q.seasonLabel), window: esc(q.seasonWindow), min: q.minNights,
      nights: plural(q.nights, COPY.common.night, COPY.common.nights)
    };
    seasonNote.innerHTML = "<span>" + t(q.nights > 0
      ? COPY.dates.seasonWithNights : COPY.dates.seasonWithoutNights, vars) + "</span>";
    show(seasonNote, true);
  } else {
    show(seasonNote, false);
  }

  $("#discountHint").innerHTML = "<span>" + esc(t(COPY.dates.discountHint, {
    nights: PRICES.weekFromNights,
    percent: Math.round(PRICES.directBookingDiscount.rate * 100)
  })) + "</span>";
  $("#feeMinNote").innerHTML = "<span>" + esc(t(COPY.event.belowFeeMinimum, {
    min: PRICES.eventFeeMinGuests })) + "</span>";
  show($("#feeMinNote"), state.hasEvent !== false);

  const minNote = $("#minNote");
  if (q.belowMinimum) {
    minNote.innerHTML = "<span>" + t(COPY.dates.belowMinimum, {
      nights: plural(q.nights, COPY.common.night, COPY.common.nights),
      season: esc(q.seasonLabel), min: q.minNights
    }) + "</span>";
    show(minNote, true);
  } else {
    show(minNote, false);
  }
}

function renderGuests(q) {
  COUNT_FIELDS.forEach(f => {
    const input = document.querySelector('[data-stepper="' + f.key + '"] [data-stepper-value]');
    if (input && document.activeElement !== input) input.value = state[f.key];
  });
  $("#stayerTotal").textContent = String(q.stayers);
  $("#stayerCap").textContent = String(q.maxStayers);

  const note = $("#stayerNote");
  const capNote = $("#capNote");
  if (q.stayers === 0) {
    note.innerHTML = "<span>" + esc(COPY.guests.needOne) + "</span>";
    show(note, true);
  } else if (q.overCapacity) {
    note.innerHTML = "<span>" + esc(t(q.occupancyExtended
      ? COPY.guests.tooManyExtended : COPY.guests.tooMany,
      { max: q.maxStayers })) + "</span>";
    show(note, true);
  } else {
    show(note, false);
  }

  /* Say why the cap moved, rather than letting it change silently. */
  if (q.occupancyExtended) {
    capNote.innerHTML = "<span>" + esc(t(COPY.guests.capRaised,
      { kids: q.counts.kids, max: PRICES.occupancy.extendedMax })) + "</span>";
    show(capNote, true);
  } else {
    show(capNote, false);
  }
  syncStepperButtons();
}

/** R6 — the extend-to-7-nights nudge, shown on dates and on the estimate. */
function renderLever(node, lever) {
  if (!node) return;
  if (!lever.applies) { show(node, false); return; }

  const vars = {
    nights: PRICES.weekFromNights,
    fee: money.format(lever.feeWaived),
    current: lever.nights,
    date: esc(fmtDate(lever.checkOut)),
    delta: money.format(Math.abs(lever.delta)),
    extra: plural(lever.extraNights, COPY.common.night, COPY.common.nights)
  };
  node.innerHTML =
    '<span class="lever__title">' + t(COPY.lever.title, vars) + '</span>' +
    t(lever.cheaper ? COPY.lever.bodyCheaper : COPY.lever.bodyDearer, vars);
  show(node, true);
}

function renderMeal(q) {
  $$('input[name="mealPlan"]').forEach(r => { r.checked = r.value === state.mealPlan; });

  /* R1 — the inclusions that apply whatever the couple picks. */
  const inc = $("#alwaysIncluded");
  if (inc && !inc.dataset.built) {
    inc.innerHTML =
      '<span class="included__title">' + esc(COPY.meal.includedTitle) + '</span>' +
      '<ul class="included__list">' +
        PRICES.alwaysIncluded.map(i => '<li>' + esc(i) + '</li>').join("") +
      '</ul>' +
      '<p class="included__foot">' + esc(COPY.meal.includedFoot) + '</p>';
    inc.dataset.built = "1";
  }

  /* R2 — the Gourmet bar disclosure, up front at the point of choosing. */
  const note = $("#gourmetBarNote");
  if (q && !q.barIncluded) {
    note.innerHTML = "<span>" + t(COPY.meal.gourmetWarning, {
      disclosure: esc(q.barDisclosure), detail: esc(q.barDetail || ""),
      corkage: esc(q.corkageNote || "")
    }) + "</span>";
    show(note, true);
  } else {
    show(note, false);
  }
}

function renderEvent(q) {
  const g = document.querySelector('[data-stepper="eventGuests"] [data-stepper-value]');
  const d = document.querySelector('[data-stepper="eventDays"] [data-stepper-value]');
  if (g && document.activeElement !== g) g.value = state.eventGuests;
  if (d && document.activeElement !== d) d.value = state.eventDays;

  $$('input[name="eventStyle"]').forEach(r => { r.checked = r.value === q.styleKey; });
  renderMenuChoices(q);

  /* Hors d'oeuvres are mandatory for every event, so the note always
     shows (London recording, [54:03-54:19]). */
  const cn = $("#cocktailNote");
  cn.innerHTML = "<span>" + esc(t(COPY.event.horsDoeuvresNote, {
    price: PRICES.eventStyles.cocktail.setPrice,
    per: PRICES.eventStyles.cocktail.guestsPerBlock,
    guests: q.eventGuests, sets: q.sets
  })) + "</span>";
  show(cn, true);

  const sef = $("#secondEntreeField");
  show(sef, q.styleKey === "buffet");
  const sei = $("#secondEntreeInput");
  if (sei && document.activeElement !== sei) sei.checked = state.secondEntree === true;

  const fm = $("#eventFeeMinNote");
  fm.innerHTML = "<span>" + esc(t(COPY.event.belowFeeMinimum, {
    min: PRICES.eventFeeMinGuests })) + "</span>";
  show(fm, true);

  const plated = $("#platedNote");
  if (q.platedOverCap) {
    plated.innerHTML = "<span>" + esc(t(COPY.event.platedOverCap, {
      cap: PRICES.eventStyles.plated.cap, guests: q.eventGuests })) + "</span>";
    show(plated, true);
  } else {
    show(plated, false);
  }

  $("#venueNote").innerHTML = "<span>" + t(COPY.event.venueNote, {
    venue: esc(q.venue), note: esc(q.venueNote), guests: q.eventGuests }) + "</span>";
  syncStepperButtons();
}

function renderExtras() {
  $$('input[name="extra"]').forEach(c => { c.checked = Boolean(state.extras[c.value]); });
  $$('input[name="scope"]').forEach(r => {
    r.checked = r.value === (state.hasEvent === false ? "stay" : "both");
  });
}

function syncStepperButtons() {
  $$("[data-stepper]").forEach(box => {
    const key = box.getAttribute("data-stepper");
    const min = Number(box.getAttribute("data-min"));
    const max = Number(box.getAttribute("data-max"));
    const value = toInt(state[key], min);
    box.querySelectorAll(".stepper__btn").forEach(btn => {
      const delta = Number(btn.getAttribute("data-delta"));
      btn.disabled = delta < 0 ? value <= min : value >= max;
    });
  });
}

/* ---------------- estimate screen ---------------- */
function lineRow(name, sub, value, cls) {
  return '<div class="line' + (cls ? " " + cls : "") + '">' +
    '<span class="line__name">' + esc(name) +
      (sub ? '<span class="line__sub">' + esc(sub) + '</span>' : "") + '</span>' +
    '<span class="line__val">' + esc(value) + '</span></div>';
}

function groupRow(label) {
  return '<div class="line line--group"><span class="line__name">' +
    esc(label) + '</span><span class="line__val"></span></div>';
}

function breakdownRows(q) {
  const L = q.lines, C = COPY.lines;
  const rows = [];
  const nightsWord = n => plural(n, COPY.common.night, COPY.common.nights);
  const daysWord = n => plural(n, COPY.common.day, COPY.common.days);

  /* ---------------- STAY ---------------- */
  rows.push(groupRow(C.groupStay || COPY.estimate.groupStay));

  rows.push(lineRow(C.included,
    t(C.includedSub, { items: q.alwaysIncluded.join(" · ") }),
    C.includedValue, "line--included"));

  rows.push(lineRow(C.accommodation,
    t(C.accommodationSub, { season: q.seasonLabel, basis: q.rateBasis }) +
    (q.accommodationOverflow > 0
      ? t(C.accommodationOverflow, {
          amount: money2.format(q.accommodationOverflow),
          included: PRICES.extraGuest.includedUpTo })
      : ""),
    money2.format(q.accommodationPreDiscount)));

  if (q.discountApplies) {
    rows.push(lineRow(t(C.discount, { percent: Math.round(q.discountRate * 100) }),
      t(C.discountSub, { nights: PRICES.weekFromNights }),
      "−" + money2.format(q.accommodationDiscount), "line--credit"));
    rows.push(lineRow(C.accommodationNet, C.accommodationNetSub,
      money2.format(L.accommodation), "line--sub"));
  }

  /* The event day carries its own menu, so it is not a meal-plan night. */
  rows.push(lineRow(C.mealPlan,
    q.hasEvent && q.eventDays > 0
      ? t(C.mealPlanEventSub, {
          plan: q.mealPlanLabel, stayers: q.stayers,
          charged: q.mealPlanNights, total: q.nights })
      : t(C.mealPlanSub, {
          plan: q.mealPlanLabel, stayers: q.stayers, nights: nightsWord(q.nights) }),
    money2.format(L.mealPlan)));

  const priced = q.extrasDetail.filter(x => !x.quoted);
  rows.push(lineRow(C.extras,
    priced.length
      ? priced.map(x => x.label + (x.units > 1 ? " ×" + x.units : "")).join(", ")
      : C.extrasNone,
    money2.format(L.extras),
    priced.length ? "" : "line--muted"));

  if (q.quotedExtras.length) {
    rows.push(lineRow(COPY.extras.quotedValue,
      q.quotedExtras.map(x => x.label).join(", "),
      "—", "line--muted"));
  }

  rows.push(lineRow(C.stayTotal, C.stayTotalSub,
    money2.format(q.stayTotal), "line--subtotal"));

  /* ---------------- EVENT ---------------- */
  if (q.hasEvent) {
    rows.push(groupRow(COPY.estimate.groupEvent));

    rows.push(lineRow(C.eventFee,
      q.eventFeeWaived
        ? (q.belowEventFeeMinimum
            ? t(C.eventFeeBelowMin, { min: q.eventFeeMinGuests })
            : t(C.eventFeeWaivedLong, { nights: PRICES.weekFromNights }))
        : t(C.eventFeeCharged, { nights: nightsWord(q.nights) }),
      money2.format(L.eventFee),
      q.eventFeeWaived ? "line--muted" : ""));

    if (q.shuttleIncluded) {
      rows.push(lineRow(C.shuttle, C.shuttleSub, C.shuttleValue, "line--included"));
    }

    /* A cocktail reception's food IS the hors d'oeuvres line below. */
    if (!q.isCocktail) {
      rows.push(lineRow(C.eventFood,
        t(C.eventFoodSub, {
          style: q.styleLabel, menu: q.menuLabel, price: q.menuPrice,
          guests: q.eventGuests, days: daysWord(q.eventDays) }),
        money2.format(L.eventFood)));
    }

    if (q.secondEntree) {
      rows.push(lineRow(C.secondEntree,
        t(C.secondEntreeSub, { guests: q.eventGuests, days: daysWord(q.eventDays) }),
        money2.format(q.secondEntreeCost)));
    }

    rows.push(lineRow(C.horsDoeuvres,
      t(C.horsDoeuvresSub, {
        sets: q.sets, price: q.setPrice, days: daysWord(q.eventDays) }),
      money2.format(q.horsDoeuvres)));

    rows.push(lineRow(C.eventDayLunch,
      t(C.eventDayLunchSub, {
        rate: PRICES.eventDayLunchPerGuest, guests: q.lunchGuests,
        days: daysWord(q.eventDays) }),
      money2.format(q.eventDayLunch)));

    rows.push(lineRow(q.barDisclosure,
      q.barNote + " " + COPY.bar.alcoholBudget,
      q.barIncluded ? C.barIncludedValue : C.barExcludedValue, "line--disclose"));

    rows.push(lineRow(C.staff,
      q.staffPerDay > 0
        ? t(C.staffSub, {
            roster: q.staffRoster.map(r => r.qty + "× " + r.role).join(", "),
            band: q.staffBand, rate: money2.format(q.staffPerDay) })
        : t(C.staffNotNeeded, { guests: q.eventGuests }),
      money2.format(L.staff),
      q.staffPerDay > 0 ? "" : "line--muted"));

    rows.push(lineRow(C.eventTotal, C.eventTotalSub,
      money2.format(q.eventTotal), "line--subtotal"));
  }

  /* ---------------- COMBINED ---------------- */
  rows.push(lineRow(C.gct, C.gctSub, money2.format(q.gct)));
  rows.push(lineRow(C.total, C.totalSub, money2.format(q.total), "line--total"));

  /* Neither of these is collected up front. */
  rows.push(lineRow(C.deposit, C.depositSub, money2.format(q.deposit), "line--muted"));
  rows.push(lineRow(C.gratuity,
    t(C.gratuitySub, { cash: money2.format(q.gratuity) }),
    "≈ " + money2.format(q.gratuity), "line--muted"));

  return rows.join("");
}

function renderEstimate(q) {
  $("#estimateLede").textContent = t(COPY.estimate.summaryLine, {
    start: fmtDate(q.checkIn), end: fmtDate(q.checkOut),
    stayers: q.stayers, guests: q.eventGuests });

  $("#rangeOut").innerHTML = money.format(q.total);

  $("#rangeCaption").textContent = q.hasEvent
    ? t(COPY.estimate.stayEventCaption, {
        nights: plural(q.nights, COPY.common.night, COPY.common.nights),
        stayers: q.stayers, guests: q.eventGuests })
    : t(COPY.estimate.stayCaption, {
        nights: plural(q.nights, COPY.common.night, COPY.common.nights),
        stayers: q.stayers });

  $("#rangeMeta").innerHTML =
    "<span>" + esc(q.seasonLabel) + "</span>" +
    "<span>" + q.nights + (q.nights === 1 ? " night" : " nights") + "</span>" +
    "<span>" + esc(q.venue) + "</span>" +
    "<span>" + esc(q.mealPlanLabel) + "</span>";

  const warn = $("#estimateWarn");
  const warnings = [];
  if (q.belowMinimum) {
    warnings.push(t(COPY.dates.belowMinimum, {
      nights: plural(q.nights, COPY.common.night, COPY.common.nights),
      season: q.seasonLabel, min: q.minNights }));
  }
  if (q.platedOverCap) {
    warnings.push(t(COPY.event.platedOverCap, {
      cap: PRICES.eventStyles.plated.cap, guests: q.eventGuests }));
  }
  if (q.overCapacity) {
    warnings.push(t(q.occupancyExtended
      ? COPY.guests.tooManyExtended : COPY.guests.tooMany, { max: q.maxStayers }));
  }
  if (warnings.length) {
    warn.innerHTML = "<span>" + warnings.map(esc).join(" ") + " " +
      esc(COPY.estimate.warningTail) + "</span>";
    show(warn, true);
  } else {
    show(warn, false);
  }

  renderLever($("#leverEstimate"), sevenNightLever(state));

  $("#lines").innerHTML = breakdownRows(q);

  const F = COPY.footnotes;
  const pct = Math.round(q.discountRate * 100);
  const notes = [
    t(F.included, { items: q.alwaysIncluded.join(", ").toLowerCase() }),
    t(F.venue, { venue: q.venue, note: q.venueNote }),

    t(F.bar, { disclosure: q.barDisclosure, corkage: q.corkageNote || "" }),
    t(F.venueSource, { source: q.venueSource || COPY.masthead.name }),
    q.discountApplies
      ? t(F.discountApplies, { percent: pct, nights: q.nights })
      : t(F.discountAvailable, { nights: PRICES.weekFromNights, percent: pct }),
    F.staffing,
    t(F.deposit, { amount: money2.format(q.deposit) }),
    t(F.gratuity, { cash: money2.format(q.gratuity), card: money2.format(q.gratuityOnCard) })
  ];
  $("#footnotes").innerHTML = notes.map(n => esc(n)).join("<br>");

  $("#mailtoBtn").setAttribute("href", buildMailto(q));
}

/* =================================================================
   Plain-text estimate — used for both mailto and clipboard
   ================================================================= */
function estimateText(q) {
  const L = q.lines, C = COPY.email, LN = COPY.lines;
  const rows = [];
  const pad = (label, value) => (label + " ").padEnd(22, ".") + " " + value;
  const nightsWord = n => plural(n, COPY.common.night, COPY.common.nights);

  rows.push(C.heading);
  rows.push(C.location);
  rows.push("");
  rows.push(C.answersHeading);
  rows.push(C.datesLabel + ": " + fmtDate(q.checkIn) + " to " + fmtDate(q.checkOut));
  rows.push(t(C.minimumSuffix, {
    nights: nightsWord(q.nights), season: q.seasonLabel, window: q.seasonWindow,
    min: q.minNights, flag: q.belowMinimum ? C.underMinimumFlag : "" }));
  rows.push(COPY.guests.title + ": " + q.stayers +
    " (" + COPY.guests.adults + " " + q.counts.adults +
    ", " + COPY.guests.teens + " " + q.counts.teens +
    ", " + COPY.guests.kids + " " + q.counts.kids +
    ", " + COPY.guests.under5 + " " + q.counts.under5 + ")");
  rows.push(COPY.meal.title + ": " + q.mealPlanLabel +
    (q.barIncluded ? "" : C.foodOnlyFlag));
  if (q.hasEvent) {
    rows.push(COPY.event.guestsLabel + ": " + q.eventGuests + " " +
      t(C.visitingSuffix, { visitors: q.visitingGuests }));
    rows.push(COPY.event.daysLabel + ": " + q.eventDays);
    rows.push(COPY.event.styleLabel + ": " + q.styleLabel);
    rows.push(q.isCocktail
      ? COPY.event.selectionsLabel + ": " + q.sets + " sets at $" + q.setPrice + " each"
      : t(C.menuLine, {
          label: COPY.event.menuLabel, menu: q.menuLabel, price: q.menuPrice }));
    rows.push(t(C.venueLine, { venue: q.venue, note: q.venueNote }));
  } else {
    rows.push(COPY.estimate.noEventNote);
  }
  const pricedX = q.extrasDetail.filter(x => !x.quoted);
  rows.push(COPY.extras.title + ": " + (pricedX.length
    ? pricedX.map(x => x.label + (x.units > 1 ? " x" + x.units : "")).join("; ")
    : COPY.common.none));
  if (q.quotedExtras.length) {
    rows.push("Requested, price to be quoted by Silent Waters:");
    q.quotedExtras.forEach(x => rows.push("  - " + x.label));
  }
  rows.push("");
  rows.push(C.includedHeading);
  q.alwaysIncluded.forEach(i => rows.push("  - " + i));
  rows.push("");
  rows.push(C.breakdownHeading);
  rows.push("");
  rows.push("-- " + COPY.estimate.groupStay + " --");

  rows.push(pad(LN.accommodation, money2.format(q.accommodationPreDiscount)) +
    "   [" + q.seasonLabel + ", " + q.rateBasis +
    (q.accommodationOverflow > 0
      ? t(C.overflowSuffix, {
          amount: money2.format(q.accommodationOverflow),
          included: PRICES.extraGuest.includedUpTo }) : "") + "]");
  if (q.discountApplies) {
    rows.push(pad(t(LN.discount, { percent: Math.round(q.discountRate * 100) }),
      "-" + money2.format(q.accommodationDiscount)));
    rows.push(pad(LN.accommodationNet, money2.format(L.accommodation)) +
      "   [" + LN.accommodationNetSub + "]");
  }
  rows.push(pad(LN.mealPlan, money2.format(L.mealPlan)) + "   [" +
    (q.hasEvent && q.eventDays > 0
      ? q.mealPlanLabel + ", " + q.stayers + " guests, " + q.mealPlanNights +
        " of " + q.nights + " nights (event day has its own menu)"
      : q.mealPlanLabel + ", " + q.stayers + " x " + nightsWord(q.nights)) + "]");
  rows.push(pad(LN.extras, money2.format(L.extras)));
  pricedX.forEach(x => {
    rows.push("    - " + x.label + " (" + x.meta + ")" +
      (x.units > 1 ? " x" + x.units : "") + " = " + money2.format(x.amount));
  });
  q.quotedExtras.forEach(x => rows.push("    - " + x.label + " (quoted by Silent Waters)"));
  rows.push(pad(LN.stayTotal, money2.format(q.stayTotal)));

  if (q.hasEvent) {
    rows.push("");
    rows.push("-- " + COPY.estimate.groupEvent + " --");
    rows.push(pad(LN.eventFee, money2.format(L.eventFee)) + "   [" +
      (q.eventFeeWaived
        ? (q.belowEventFeeMinimum
            ? t(LN.eventFeeBelowMin, { min: q.eventFeeMinGuests })
            : t(LN.eventFeeWaivedLong, { nights: PRICES.weekFromNights }))
        : t(LN.eventFeeCharged, { nights: nightsWord(q.nights) })) + "]");
    if (q.shuttleIncluded) {
      rows.push(pad(COPY.lines.shuttle, "INCLUDED") + "   [" + COPY.lines.shuttleSub + "]");
    }
    if (!q.isCocktail) {
      rows.push(pad(LN.eventFood, money2.format(L.eventFood)) + "   [$" +
        q.menuPrice + " x " + q.eventGuests + " x " + q.eventDays + "]");
    }
    if (q.secondEntree) {
      rows.push(pad(LN.secondEntree, money2.format(q.secondEntreeCost)) +
        "   [$15 x " + q.eventGuests + " x " + q.eventDays + "]");
    }
    rows.push(pad(LN.horsDoeuvres, money2.format(q.horsDoeuvres)) +
      "   [mandatory - " + q.sets + " sets x $" + q.setPrice + " x " + q.eventDays + "]");
    rows.push(pad(LN.eventDayLunch, money2.format(q.eventDayLunch)) +
      "   [$" + PRICES.eventDayLunchPerGuest + " x " + q.lunchGuests +
      " staying guests x " + q.eventDays + "]");
    rows.push(pad(C.barLabel, q.barIncluded ? C.barNotEstimated : C.barNotIncluded) +
      "   [" + q.barDisclosure + "]");
    rows.push("    " + q.barNote);
    rows.push("    " + COPY.bar.alcoholBudget);
    if (q.corkageNote) rows.push("    " + q.corkageNote);
    rows.push(pad(LN.staff, money2.format(L.staff)) + "   [" +
      (q.staffPerDay > 0
        ? q.staffRoster.map(r => r.qty + "x " + r.role).join(", ") + " (" + q.staffBand +
          ") at " + money2.format(q.staffPerDay) + " per event day"
        : t(LN.staffNotNeeded, { guests: q.eventGuests })) + "]");
    rows.push(pad(LN.eventTotal, money2.format(q.eventTotal)));
  }

  rows.push("");
  rows.push(pad(LN.gct, money2.format(q.gct)) + "   [" + LN.gctSub + "]");
  rows.push(pad(C.totalLabel, money2.format(q.total)));
  rows.push("");
  rows.push(C.notIncludedHeading);
  rows.push(t(C.notIncludedDeposit, { amount: money2.format(q.deposit) }));
  rows.push("  " + LN.gratuity + " — approximately " + money2.format(q.gratuity) + ".");
  rows.push(C.notIncludedBar);

  const lever = sevenNightLever(q.input);
  if (lever.applies) {
    rows.push("");
    rows.push(t(C.leverNote, {
      week: PRICES.weekFromNights, fee: money2.format(lever.feeWaived),
      date: fmtDate(lever.checkOut), total: money2.format(lever.extendedTotal),
      sign: lever.cheaper ? "-" : "+", delta: money2.format(Math.abs(lever.delta)) }));
  }

  rows.push("");
  rows.push(C.signOff);
  return rows.join("\n");
}

/* =================================================================
   Events
   ================================================================= */
let toastTimer = null;
function toast(msg) {
  const node = $("#toast");
  node.textContent = msg;
  node.setAttribute("data-show", "1");
  window.clearTimeout(toastTimer);
  toastTimer = window.setTimeout(() => node.setAttribute("data-show", "0"), 2200);
}

function goTo(delta) {
  const screens = activeScreens();
  const i = clamp(screenIndex(state.screen) + delta, 0, screens.length - 1);
  setState({ screen: screens[i].id });
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function goToScreen(id) {
  setState({ screen: id });
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function wire() {
  $("#backBtn").addEventListener("click", () => goTo(-1));

  $("#introStart").addEventListener("click", () => goToScreen("dates"));

  /* ---- date picker ---- */
  $("#dateField").addEventListener("click", () => {
    ui.calOpen = !ui.calOpen;
    if (ui.calOpen) {
      ui.month = (state.checkIn || todayIso()).slice(0, 7) + "-01";
    }
    render();
  });

  $("#cal").addEventListener("click", ev => {
    const nav = ev.target.closest("[data-cal-nav]");
    if (nav) {
      const step = Number(nav.getAttribute("data-cal-nav"));
      const a = ui.month.split("-").map(Number);
      const d = new Date(Date.UTC(a[0], a[1] - 1 + step, 1));
      ui.month = d.toISOString().slice(0, 8) + "01";
      renderCalendar();
      return;
    }
    if (ev.target.closest("[data-cal-close]")) {
      ui.calOpen = false;
      render();
      return;
    }
    const day = ev.target.closest("[data-cal-day]");
    if (!day || day.disabled) return;

    const next = pickerReduce(
      { checkIn: state.checkIn, checkOut: state.checkOut },
      day.getAttribute("data-cal-day"));
    /* Two taps and done: a completed range closes the calendar itself. */
    if (pickerPhase(next) === "complete") ui.calOpen = false;
    setState({ checkIn: next.checkIn, checkOut: next.checkOut });
  });

  /* A tap anywhere else closes it.

     Registered on the CAPTURE phase deliberately. The month arrows and the
     day cells rebuild the calendar's innerHTML, which detaches the very
     node that was clicked; by the time a bubble-phase listener ran,
     ev.target.closest("#cal") would be null on a detached node and this
     would close the picker on every arrow tap. In capture we run before
     any of that, while the target is still in the tree. */
  document.addEventListener("click", ev => {
    if (!ui.calOpen) return;
    const t = ev.target;
    if (t.closest && (t.closest("#cal") || t.closest("#dateField"))) return;
    ui.calOpen = false;
    render();
  }, true);
  $("#nextBtn").addEventListener("click", () => goTo(1));

  /* Free-number inputs. Dates never come through here — they only ever
     come from pickerReduce, which cannot produce a backwards range. */
  document.addEventListener("input", ev => {
    const bind = ev.target.getAttribute && ev.target.getAttribute("data-bind");
    if (!bind) return;
    const patch = {};
    patch[bind] = ev.target.value;
    setState(patch);
  });

  /* steppers: buttons and direct typing */
  document.addEventListener("click", ev => {
    const btn = ev.target.closest && ev.target.closest(".stepper__btn");
    if (!btn) return;
    const box = btn.closest("[data-stepper]");
    const key = box.getAttribute("data-stepper");
    const min = Number(box.getAttribute("data-min"));
    const max = Number(box.getAttribute("data-max"));
    const delta = Number(btn.getAttribute("data-delta"));
    const patch = {};
    patch[key] = clamp(toInt(state[key], min) + delta, min, max);
    setState(patch);
  });

  document.addEventListener("change", ev => {
    const t = ev.target;

    if (t.matches && t.matches("[data-stepper-value]")) {
      const box = t.closest("[data-stepper]");
      const key = box.getAttribute("data-stepper");
      const min = Number(box.getAttribute("data-min"));
      const max = Number(box.getAttribute("data-max"));
      const patch = {};
      patch[key] = clamp(toInt(t.value, min), min, max);
      setState(patch);
      return;
    }

    if (t.name === "scope") { setState({ hasEvent: t.value === "both" }); return; }

    if (t.name === "mealPlan") { setState({ mealPlan: t.value }); return; }

    if (t.name === "eventStyle") {
      /* Cocktail has no per-person menus — it is priced by selection — so
         there is no menuKey to carry over. */
      const style = PRICES.eventStyles[t.value];
      const firstMenu = style.menus.length ? style.menus[0].key : null;
      setState({ eventStyle: t.value, menuKey: firstMenu });
      return;
    }

    if (t.name === "menuKey") { setState({ menuKey: t.value }); return; }

    if (t.id === "secondEntreeInput") { setState({ secondEntree: t.checked }); return; }

    if (t.name === "extra") {
      const extras = Object.assign({}, state.extras);
      extras[t.value] = t.checked;
      setState({ extras: extras });
      return;
    }
  });

  $("#copyBtn").addEventListener("click", async () => {
    const text = estimateText(calcQuote(state));
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
      } else {
        const ta = el("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }
      toast(COPY.estimate.copied);
    } catch (err) {
      console.error("Copy failed:", err);
      toast(COPY.estimate.copyFailed);
    }
  });

  /* Navigation only — localStorage already holds every answer, so stepping
     back simply re-renders the previous screen with them intact. */
  $("#estimateBack").addEventListener("click", () => goTo(-1));

  $("#startOver").addEventListener("click", () => {
    try { window.localStorage.removeItem(STORAGE_KEY); }
    catch (err) { console.warn("Could not clear saved answers:", err); }
    state = Object.assign({}, DEFAULTS, { extras: Object.assign({}, DEFAULTS.extras) });
    ui.calOpen = false; ui.month = "";
    saveState();
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
}

/* Level 1: the hand-edited list. Level 2 merges the synced feed below. */
applyBlockedDates([]);

/* Level 2 — availability published by the sync job as blocked-dates.json
   in this same directory. Absent until London provides the eviivo iCal
   feed, so a 404 (or file://, or a parse error) is entirely normal: fall
   back to the manual list with no console noise and no UI difference. */
(function fetchSyncedAvailability() {
  if (typeof fetch !== "function") return;
  fetch("blocked-dates.json?v=" + todayIso(), { cache: "no-store" })
    .then(r => (r.ok ? r.json() : null))
    .then(data => {
      if (!data || !Array.isArray(data.nights)) return;
      applyBlockedDates(data.nights);
      render();
    })
    .catch(() => { /* dormant until the feed exists */ });
})();
